<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>往月数据看板</title>
<style>
*{box-sizing:border-box;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fa;color:#1f2937;margin:0;padding:32px;}
.wrap{max-width:1100px;margin:0 auto;}
h1{font-size:24px;margin:0 0 4px;}
.sub{color:#6b7280;font-size:13px;margin-bottom:20px;}
.mcard{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(16,24,40,.08);padding:20px 22px;margin-bottom:18px;}
.mhead{font-size:18px;font-weight:800;color:#7c3aed;margin-bottom:14px;display:flex;align-items:baseline;gap:12px;}
.msrc{font-size:12px;font-weight:500;color:#9ca3af;}
.mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.board{background:#fafbfc;border:1px solid #eef1f5;border-radius:10px;padding:14px;}
.board.empty{color:#9ca3af;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;}
.bname{font-size:14px;font-weight:700;margin-bottom:8px;color:#1AABCB;}
.bkpi{font-size:12px;color:#6b7280;margin-bottom:10px;}
.bkpi b{color:#1f2937;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #eef1f5;}
th{color:#6b7280;font-weight:600;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
tr.sp td{color:#b45309;}
.ipslink{display:inline-block;margin-top:8px;color:#F6AA00;font-weight:600;text-decoration:none;}
.ipslink:hover{text-decoration:underline;}
.foot{color:#e02424;font-size:12px;margin-top:18px;line-height:1.7;}
@media(max-width:860px){.mgrid{grid-template-columns:1fr;}}
</style></head><body><div class="wrap">
<h1>往月数据看板</h1>
<div class="sub">每月 1 号自动汇总上月最后一天的各看板数据 ｜ 生成于 2026-07-24 19:06</div>
<div class='board empty' style='grid-column:1/-1;padding:40px 0;'>暂无往月汇总数据。每月 1 号会自动汇总「上月最后一天」的三类看板，完整结束的月份才会出现在此处。</div>
<div class="foot">⚠️ 内含会员与门店经营敏感数据，请勿外传。</div>
</div></body></html>
