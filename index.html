<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>会员数据驾驶舱 · 已停用</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-text-size-adjust:100%!important}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:linear-gradient(135deg,#0b2540,#0f172a);color:#e2e8f0;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .box{background:rgba(30,41,59,.92);padding:40px 34px;border-radius:18px;
       box-shadow:0 16px 50px rgba(0,0,0,.5);max-width:440px;width:100%;text-align:center;
       border:1px solid rgba(246,170,0,.3)}
  .logo{width:48px;height:48px;border-radius:12px;margin:0 auto 16px;
        background:linear-gradient(135deg,#1AABCB,#29C5E8);
        display:flex;align-items:center;justify-content:center;color:#06283b;font-weight:800;font-size:22px}
  .badge{display:inline-block;font-size:12px;color:#F6AA00;border:1px solid rgba(246,170,0,.5);
         border-radius:20px;padding:3px 12px;margin-bottom:14px;letter-spacing:1px}
  h2{margin:0 0 10px;font-size:20px;color:#fff}
  p{font-size:14px;color:#94a3b8;line-height:1.8;margin:0 0 16px}
  .highlight{color:#29C5E8;font-weight:600}
  .tip{font-size:12px;color:#64748b;margin-top:4px}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">首</div>
    <span class="badge">链接已停用</span>
    <h2>本公开地址已作废</h2>
    <p>原会员数据驾驶舱的公开访问已关闭。</p>
    <p>请前往<span class="highlight">首茂云 APP → 会员数据应用</span>查看。</p>
    <p class="tip">原链接分享给他人已无效。</p>
  </div>
</body>
</html>
