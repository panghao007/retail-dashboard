<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPS合规收银数据看板</title>
<style>
  * {{ margin:0; padding:0; box-sizing:border-box; }}
  body {{ font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f4f6f8; color:#1f2933; padding:0 16px; -webkit-font-smoothing:antialiased; }}
  .wrap {{ max-width:760px; margin:0 auto; padding:48px 0 60px; }}
  .head {{ margin-bottom:28px; }}
  .brandbar {{ display:inline-block; width:44px; height:5px; border-radius:3px;
    background:{BRAND}; margin-bottom:16px; }}
  h1 {{ font-size:26px; font-weight:800; letter-spacing:-.3px; }}
  .desc {{ color:#6b7280; font-size:14px; margin-top:8px; line-height:1.6; }}
  .count {{ display:inline-block; margin-top:14px; font-size:13px; color:{BRAND};
    background:rgba(26,171,203,.1); padding:4px 12px; border-radius:20px; font-weight:600; }}
  .back {{ display:inline-block; margin-bottom:18px; font-size:13px; color:{BRAND};
    text-decoration:none; font-weight:600; }}
  .back:hover {{ text-decoration:underline; }}
  .section-title {{ display:flex; align-items:center; gap:9px; font-size:17px; font-weight:800; color:#1f2933; margin:8px 0 4px; }}
  .branddot {{ width:9px; height:9px; border-radius:50%; background:{ACCENT}; display:inline-block; }}
  .section-desc {{ color:#6b7280; font-size:13px; margin-bottom:2px; }}
  .list {{ margin-top:24px; display:flex; flex-direction:column; gap:12px; }}
  .card {{ display:flex; align-items:center; justify-content:space-between;
    background:#fff; border:1px solid #e5e9ef; border-radius:14px; padding:18px 20px;
    transition:all .15s ease; }}
  .card:hover {{ border-color:{BRAND}; box-shadow:0 6px 20px rgba(26,171,203,.12); transform:translateY(-1px); }}
  .card.latest {{ border-color:{BRAND}; background:linear-gradient(180deg,rgba(26,171,203,.05),#fff); }}
  .card-main {{ flex:1; text-decoration:none; color:inherit; }}
  .card-title {{ font-size:16px; font-weight:700; }}
  .card-sub {{ font-size:12.5px; color:#9099a5; margin-top:5px; }}
  .card-right {{ display:flex; align-items:center; gap:14px; flex-shrink:0; }}
  .dl {{ flex-shrink:0; font-size:13px; font-weight:600; color:{BRAND};
    text-decoration:none; background:rgba(26,171,203,.1); padding:6px 12px; border-radius:9px; transition:all .15s ease; }}
  .dl:hover {{ background:{BRAND}; color:#fff; }}
  .card-arrow {{ font-size:26px; color:#c2c9d2; font-weight:300; }}
  .card:hover .card-arrow {{ color:{BRAND}; }}
  .tag {{ display:inline-block; font-size:11px; font-weight:700; color:#fff;
    background:{ACCENT}; padding:2px 8px; border-radius:6px; margin-left:8px; vertical-align:2px; }}
  .empty {{ text-align:center; color:#9099a5; padding:60px 0; }}
  .warn {{ color:#e02424; font-weight:700; }}
  .suggest {{ color:#e02424; margin-top:12px; font-size:13px; line-height:1.95; font-weight:600; text-align:left; max-width:560px; margin-left:auto; margin-right:auto; }}
  .suggest-title {{ font-weight:800; font-size:14px; margin-bottom:4px; }}
  .suggest-em {{ font-weight:800; margin-top:4px; }}
  .foot {{ margin-top:32px; text-align:center; color:#aab2bd; font-size:12px; line-height:1.7; }}
  .navlist {{ margin-top:30px; display:flex; flex-direction:column; gap:16px; }}
  .navcard {{ display:flex; align-items:center; justify-content:space-between; gap:16px;
    background:#fff; border:1px solid #e5e9ef; border-radius:16px; padding:24px 26px;
    text-decoration:none; color:inherit; transition:all .15s ease; }}
  .navcard:hover {{ border-color:{BRAND}; box-shadow:0 8px 26px rgba(26,171,203,.14); transform:translateY(-2px); }}
  .nc-dot {{ width:12px; height:12px; border-radius:50%; background:{BRAND}; flex-shrink:0; }}
  .navcard.alt .nc-dot {{ background:{ACCENT}; }}
  .nc-main {{ flex:1; }}
  .nc-title {{ font-size:18px; font-weight:800; }}
  .nc-sub {{ font-size:13px; color:#9099a5; margin-top:6px; }}
  .nc-arrow {{ font-size:30px; color:#c2c9d2; font-weight:300; }}
  .navcard:hover .nc-arrow {{ color:{BRAND}; }}</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">‹ 返回导航</a>
    <div class="head">
      <div class="brandbar"></div>
      <h1>IPS合规收银数据看板</h1>
      <div class="section-desc">由同事维护、自助更新的 IPS 合规收银数据看板。</div>
    </div>
    <div id="peer-section">
      <div class="list" id="peer-list"></div>
    </div>
    <div class="empty" id="peer-empty" style="display:none;">暂无 IPS 合规收银数据看板</div>
    
    <div class="foot">
      <div class="warn">内含会员与门店经营敏感数据，请勿外传</div>
      <div class="suggest">
        <div class="suggest-title">建议</div>
        <div>· 对无效占比偏高的分公司、门店开展会员实名与规范开单专项整改。</div>
        <div>· 重点核查无效订单集中门店的开单规范性及号码使用情况。</div>
        <div class="suggest-em">重视公司数字资产</div>
      </div>
    </div>
  </div>
<script>
(function(){
  var list = document.getElementById('peer-list');
  var empty = document.getElementById('peer-empty');
  if(!list) return;
  fetch('peer/manifest.json?t=' + Date.now())
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(arr){
      if(!Array.isArray(arr) || !arr.length) { empty.style.display = 'block'; return; }
      arr.forEach(function(it){
        var title = it.title || 'IPS合规收银数据看板';
        var file = it.file || '';
        var updated = it.updated ? ('更新于 ' + it.updated) : '';
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = '<a class="card-main" href="' + file + '">'
          + '<div class="card-title">' + title + '</div>'
          + '<div class="card-sub">' + updated + '</div></a>'
          + '<div class="card-right"><div class="card-arrow">›</div></div>';
        list.appendChild(card);
      });
    })
    .catch(function(e){ empty.style.display = 'block'; });
})();
</script>
</body>
</html>
