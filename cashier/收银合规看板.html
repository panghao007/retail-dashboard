function keyToYmd(k){ return k? (k.slice(0,4)+"-"+k.slice(4,6)+"-"+k.slice(6,8)) : ""; }

function ratePct(c,nc){ return (c+nc)>0? c/(c+nc)*100 : 0; }
function fmt(n){ return (n==null)?"0":n.toLocaleString("en-US"); }
function dBadge(cur, prev, kind){
  if(prev==null) return '<span class="d flat">— 无前日</span>';
  var d=cur-prev;
  if(d===0) return '<span class="d flat">±0</span>';
  var up=d>0;
  var good = kind==='neutral' ? null : (kind==='up'? up : !up);
  var col = good==null? '#9ca3af' : (good? '#1a9e4b':'#c0392b');
  return '<span class="d" style="color:'+col+'">'+(up?'▲':'▼')+Math.abs(d)+'</span>';
}
function dPP(cur, prev){
  if(prev==null) return '<span class="d flat">— 无前日</span>';
  var d=Math.round((cur-prev)*100)/100;
  if(d===0) return '<span class="d flat">±0.00pp</span>';
  var up=d>0; var col= up?'#1a9e4b':'#c0392b';
  return '<span class="d" style="color:'+col+'">'+(up?'▲':'▼')+Math.abs(d).toFixed(2)+'pp</span>';
}

    +'<div class="sec"><h2>按门店（当月累积 · 右列为日环比对比前一天）</h2><table><thead><tr><th>销售门店</th><th style="text-align:right">笔数</th><th style="text-align:right">合规</th><th style="text-align:right">不合规</th><th style="text-align:right">剔除</th><th style="text-align:right">门店合规率</th><th style="text-align:right">不合规Δ</th></tr></thead><tbody>'+(store_rows||'<tr><td colspan=7 style="text-align:center;color:#1a9e4b">✅ 各门店均合规</td></tr>')+'</tbody></table></div>'
    +'<div class="sec"><h2>按支付通道分布（Top40 · 右列为日环比对比前一天不合规Δ）</h2><table><thead><tr><th>支付通道</th><th style="text-align:right">笔数</th><th style="text-align:right">合规</th><th style="text-align:right">不合规</th><th style="text-align:right">剔除</th><th style="text-align:right">不合规Δ</th></tr></thead><tbody>'+chan_rows+'</tbody></table></div>'
    +'<div class="sec"><h2>✅ 100% 合规门店（共 '+fmt(perfect.length)+' 家 / 占全部 '+fmt(total_stores)+' 家门店的 '+perfect_pct+'%）</h2><p style="font-size:13px;color:#667;margin:0 0 10px;line-height:1.7">以下门店在统计日<b>合规收款笔数 &gt; 0</b> 且 <b>不合规笔数 = 0</b>，即 100% 合规。</p><table><thead><tr><th>销售门店</th><th style="text-align:right">收款笔数</th><th style="text-align:right">合规</th><th style="text-align:right">门店合规率</th></tr></thead><tbody>'+(perfect_rows||'<tr><td colspan=4 style="text-align:center;color:#c0392b">暂无 100% 合规门店</td></tr>')+'</tbody></table></div>'
    +'<div class="sec"><h2>不合规概览（共 '+fmt(D.noncompliant)+' 笔）</h2><p style="font-size:13px;color:#667;margin:0 0 10px;line-height:1.7">逐笔明细（单据、门店、会员号等）可下载 CSV 查看；不合规按所属分公司分布见上方表格。</p><button class="dlbtn" onclick="downloadCSV()">⬇ 下载不合规明细 CSV</button></div>'
    +'<div class="note">'
    +'· 已剔除<b>退货订单</b> <b>'+fmt(D.excluded_return)+'</b> 笔（不计入任何统计）。<br>'
    +'· 已剔除门店名含「ASP」的结算明细 <b>'+fmt(D.excluded_asp)+'</b> 笔（不计入任何统计）。<br>'
    +'· 已剔除门店所属分公司在映射表中标记为「剔除」的结算明细 <b>'+fmt(D.excluded_branch)+'</b> 笔（不计入任何统计）。<br>'
    +'判定规则（依据《通报商品分类-新.xlsx·收款分类》，随规则表动态更新）：<br>'
    +ruleDesc()+'· 规则未覆盖（sheet3 无此支付通道）单列示，不计入合规率分母。</div>';
  document.getElementById('content').innerHTML=html;
}
function ruleDesc(){
  var groups={合规:[],不合规:[],"有条件合规":[],剔除:[]};
  for(var ch in RULE_MAP){ var c=RULE_MAP[ch]; if(c==="剔除")groups["剔除"].push(ch); else if(c==="不合规")groups["不合规"].push(ch); else if(c==="有三方单号的视为合规")groups["有条件合规"].push(ch); else groups["合规"].push(ch); }
  function L(l,items,note){ if(!items.length)return ""; return "· <b>"+l+"</b>："+items.join(", ")+(note||"")+"<br>\n"; }
  return L("合规",groups["合规"])+L("不合规",groups["不合规"])+L("有条件合规",groups["有条件合规"],"——有「第三方订单号」才合规，否则不合规")+L("剔除",groups["剔除"],"（非收款方式）");
}
function downloadCSV(){
  var rows=getCurrentRows();
  var go=function(rows){
    if(!rows||!rows.length){ alert("当前无不合格明细"); return; }
    var cols=["单据日期","业务组织","所属分公司","销售门店","单据编号","支付通道","收款方式","收款类型","会员手机号","第三方订单号","判定"];
    var esc=function(s){ s=String(s==null?"":s); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
    var lines=[cols.join(",")];
    rows.forEach(function(r){ lines.push(cols.map(function(c){return esc(r[c]);}).join(",")); });
    var blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="不合规明细_"+TKEY+".csv"; a.click();
  };
  if(rows&&rows.length){ go(rows); return; }
  fetch("daily/noncompliant_"+T+".json").then(function(r){return r.json();}).then(go).catch(function(){ alert("明细加载失败"); });
}
var _CURRENT_ROWS=[];
function getCurrentRows(){ return _CURRENT_ROWS; }

(function(){
  var content=document.getElementById('content');
  if(!D){ content.innerHTML='<div class="note">暂无可用数据</div>'; document.getElementById('period').textContent='（无数据）'; return; }
  draw(D, D1, T, T1);
  document.getElementById('period').textContent='统计区间（当月累积）：'+keyToYmd(T)+(T1?(' ｜ 日环比对比前一天：'+keyToYmd(T1)):'（无前日数据，无法对比）');
  document.getElementById('noteUpd').textContent=GENERATED? ('数据更新于 '+GENERATED):'';
})();
function drawTrend(){
  var cv=document.getElementById('valTrend');
  if(!cv||!window.TREND||!TREND.length) return;
  var activeBranch='全部';
  var gPts=[];
  var tip=cv.parentElement.querySelector('#vtTip');
  function fmt(n){ n=Math.round(n||0); return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,','); }
  function fmtDay(ds){ var m=String(ds).match(/(\d{1,2})$/); return (m?m[1]:ds)+'日'; }

  // 动态生成分公司按钮（与会员有效性一致）
  var btnContainer=cv.closest('.sec').querySelector('.trend-btns');
  if(btnContainer){
    var bSet={};
    TREND.forEach(function(p){ if(p.branches){ Object.keys(p.branches).forEach(function(b){bSet[b]=1;}); } });
    var bNames=Object.keys(bSet).sort();
    bNames.forEach(function(b){
      var btn=document.createElement('button');
      btn.className='trend-btn'; btn.setAttribute('data-vt-branch',b); btn.textContent=b;
      btnContainer.appendChild(btn);
    });
    btnContainer.addEventListener('click', function(e){
      var tb=e.target.closest('.trend-btn'); if(!tb) return;
      btnContainer.querySelectorAll('.trend-btn').forEach(function(b){b.classList.remove('active');});
      tb.classList.add('active');
      activeBranch=tb.getAttribute('data-vt-branch');
      drawCt();
    });
  }

  function drawCt(){
    var w=cv.clientWidth, h=320, dpr=window.devicePixelRatio||1;
    cv.width=w*dpr; cv.height=h*dpr;
    var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    var pl=48,pr=48,pt=18,pb=40, cw=w-pl-pr, ch=h-pt-pb, n=TREND.length;
    if(!n) return;
    if(tip) tip.style.display='none';
    gPts=[];
    var data=TREND.map(function(d){
      var row={date:d.date.slice(4)};
      if(activeBranch==='全部'||!d.branches){ row.invalid=d.invalid||0; }
      else{ var br=d.branches[activeBranch]; row.invalid=br?br.invalid:0; }
      return row;
    });
    var maxV=0; data.forEach(function(d){maxV=Math.max(maxV,d.invalid||0);});
    maxV=Math.ceil(maxV/10)*10||10;
    ctx.strokeStyle='#eef0f3'; ctx.fillStyle='#9aa3ad'; ctx.font='11px sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    for(var i=0;i<=5;i++){var val=maxV*i/5,y=pt+ch-val/maxV*ch;ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(pl+cw,y);ctx.stroke();ctx.fillText(val,pl-6,y);}
    ctx.textAlign='center'; ctx.textBaseline='top';
    var step=n>1?cw/(n-1):0;
    // 日期竖向显示（防手机叠压）
    data.forEach(function(d,i){var x=pl+step*i; ctx.save(); ctx.translate(x,pt+ch+6); ctx.rotate(-Math.PI/2); ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillText(fmtDay(d.date),0,0); ctx.restore();});
    // 固定显示当前维度「当日」不合规笔数（与折线一致，每天变化，非区间累计）
    var lastV=data[data.length-1].invalid||0;
    ctx.fillStyle='#c0392b'; ctx.font='bold 13px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('当日: '+fmt(lastV)+' 笔', pl, pt-2);
    ctx.fillStyle='#9aa3ad'; ctx.font='10px sans-serif';
    ctx.fillText(activeBranch==='全部'?'(全部)': '('+activeBranch+')', pl, pt+12);
    data.forEach(function(d,i){ var x=pl+step*i, v=d.invalid||0, y=pt+ch-v/maxV*ch; gPts.push({x:x,y:y,date:d.date,invalid:v,p:TREND[i]}); });
    function plot(key,color,width){
      ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath(); var st=false;
      data.forEach(function(d,i){var x=pl+step*i;var v=d[key];if(v==null||v==undefined){st=false;return;}var y=pt+ch-v/maxV*ch;if(!st){ctx.moveTo(x,y);st=true;}else ctx.lineTo(x,y);});
      ctx.stroke();
      data.forEach(function(d,i){var v=d[key];if(v==null||v==undefined)return;var x=pl+step*i;var y=pt+ch-v/maxV*ch;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.stroke();});
    }
    plot('invalid','#c0392b',2.6);
  }

  function showTip(pt){
    var p=pt.p;
    var html='<div class="vt-tip-d">'+p.date+'</div>';
    if(activeBranch==='全部'){
      html+='<div class="vt-tip-row">不合规笔数：<b>'+fmt(pt.invalid)+'</b></div>';
      html+='<div class="vt-tip-row">合规笔数：'+fmt(p.valid||0)+'</div>';
      html+='<div class="vt-tip-row">总笔数：'+fmt(p.total||0)+'</div>';
    } else {
      var br=p.branches?p.branches[activeBranch]:null;
      html+='<div class="vt-tip-row">'+activeBranch+' 不合规笔数：<b>'+fmt(br?br.invalid:0)+'</b></div>';
      if(br){ html+='<div class="vt-tip-row">合规笔数：'+fmt(br.valid||0)+'</div>'; html+='<div class="vt-tip-row">总笔数：'+fmt(br.total||0)+'</div>'; }
    }
    tip.innerHTML=html; tip.style.display='block';
    var tw=tip.offsetWidth, th=tip.offsetHeight, rect=cv.getBoundingClientRect();
    var left=pt.x+14; if(left+tw>rect.width) left=pt.x-tw-14; if(left<0) left=4;
    var top=pt.y-th-12; if(top<0) top=pt.y+16;
    tip.style.left=left+'px'; tip.style.top=top+'px';
  }
  function hitTest(mx,my){ var best=-1,bd=1e9; for(var i=0;i<gPts.length;i++){var dx=gPts[i].x-mx,dy=gPts[i].y-my,dd=dx*dx+dy*dy; if(dd<bd){bd=dd;best=i;}} return (best>=0&&bd<=196)?best:-1; }
  cv.addEventListener('click', function(e){
    var rect=cv.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
    var idx=hitTest(mx,my);
    if(idx>=0) showTip(gPts[idx]); else if(tip) tip.style.display='none';
  });
  cv.addEventListener('mousemove', function(e){
    var rect=cv.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
    cv.style.cursor = hitTest(mx,my)>=0 ? 'pointer' : 'default';
  });

  drawCt();
}
drawTrend();
</script>
