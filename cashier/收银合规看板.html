    for(var c in d.cat_amount) cat_amount[c]=(cat_amount[c]||0)+d.cat_amount[c];
    for(var ch in d.channel_stat){ var cv=d.channel_stat[ch]; var cs=channel_stat[ch]||(channel_stat[ch]={count:0,amount:0,cat:{}}); cs.count+=cv.count; cs.amount+=cv.amount; for(var cc in cv.cat) cs.cat[cc]=(cs.cat[cc]||0)+cv.cat[cc]; }
    for(var s in d.store_stat) addStore(s,d.store_stat[s]);
    for(var o in d.org_stat) addOrg(o,d.org_stat[o]);
    for(var b in d.branch_stat) addBranch(b,d.branch_stat[b]);
    (d.noncompliant_rows||[]).forEach(function(r){rows.push(r);});
  });
  var bs_store={};
  for(var s in store_stat){ var br=STORE_BRANCH[s]||""; if(!br) continue; var b=bs_store[br]||(bs_store[br]={total:0,comp:0,noncomp:0}); b.total++; if(store_stat[s].noncomp===0 && store_stat[s].comp>0) b.comp++; if(store_stat[s].noncomp>0) b.noncomp++; }
  for(var b in branch_stat){ var bb=bs_store[b]||{total:0,comp:0,noncomp:0}; branch_stat[b].stores_total=bb.total; branch_stat[b].stores_comp=bb.comp; branch_stat[b].stores_noncomp=bb.noncomp; branch_stat[b].rate=((branch_stat[b].comp+branch_stat[b].noncomp)>0)? Math.round(branch_stat[b].comp/(branch_stat[b].comp+branch_stat[b].noncomp)*100*100)/100 : 0; branch_stat[b].perfect_pct=(bb.total>0)? Math.round(bb.comp/bb.total*1000)/10 : 0; }
  for(var s in store_stat){ var st=store_stat[s]; st.rate=(st.comp+st.noncomp>0)? Math.round(st.comp/(st.comp+st.noncomp)*100*100)/100 : 0; }
  return {total:total,compliant:comp,noncompliant:nonc,excluded:excl,unmatched:unm,excluded_asp:easp,excluded_return:eret,excluded_branch:ebr,cat_amount:cat_amount,channel_stat:channel_stat,store_stat:store_stat,org_stat:org_stat,branch_stat:branch_stat,noncompliant_rows:rows};
}
function ratePct(c,nc){ return (c+nc)>0? c/(c+nc)*100 : 0; }
function fmt(n){ return (n==null)?"0":n.toLocaleString("en-US"); }
function dBadge(cur, prev, kind){
  if(prev==null) return '<span class="d flat">— 无前日</span>';
  var d=cur-prev;
  if(d===0) return '<span class="d flat">±0</span>';
  var up=d>0;
  var good = kind==='neutral' ? null : (kind==='up'? up : !up);
  var col = good==null? '#9ca3af' : (good? '#1a9e4b':'#c0392b');
  return '<span class="d" style="color:'+col+'">'+(up?'▲':'▼')+Math.abs(d)+'</span>';
}
function dPP(cur, prev){
  if(prev==null) return '<span class="d flat">— 无前日</span>';
  var d=Math.round((cur-prev)*100)/100;
  if(d===0) return '<span class="d flat">±0.00pp</span>';
  var up=d>0; var col= up?'#1a9e4b':'#c0392b';
  return '<span class="d" style="color:'+col+'">'+(up?'▲':'▼')+Math.abs(d).toFixed(2)+'pp</span>';
}

function draw(D, D1, T, T1){
  var rT=ratePct(D.compliant,D.noncompliant);
  var r1=D1? ratePct(D1.compliant,D1.noncompliant):null;
  var kpi='<div class="kpis">'
    +'<div class="card"><div class="n">'+fmt(D.total)+'</div><div class="l">有效收款笔数</div><div class="d">较前一天 '+dBadge(D.total,D1&&D1.total,'neutral')+'</div></div>'
    +'<div class="card good"><div class="n">'+fmt(D.compliant)+'</div><div class="l">合规笔数</div><div class="d">较前一天 '+dBadge(D.compliant,D1&&D1.compliant,'up')+'</div></div>'
    +'<div class="card bad"><div class="n">'+fmt(D.noncompliant)+'</div><div class="l">不合规笔数</div><div class="d">较前一天 '+dBadge(D.noncompliant,D1&&D1.noncompliant,'down')+'</div></div>'
    +'<div class="card"><div class="n">'+Math.round(rT*100)/100+'%</div><div class="l">合规率（合规/合规+不合规）</div><div class="d">较前一天 '+dPP(rT,r1)+'</div></div>'
    +'<div class="card"><div class="n">'+fmt(D.excluded)+'</div><div class="l">剔除（现金/赠品/会员）</div><div class="d">较前一天 '+dBadge(D.excluded,D1&&D1.excluded,'neutral')+'</div></div>'
    +'</div>';
  if(D1){
    document.getElementById('cmp').style.display='block';
    document.getElementById('cmp').innerHTML='📊 <b>对比前一天（'+keyToYmd(T1)+'）</b>：有效收款 '+dBadge(D.total,D1.total,'neutral')+' ｜ 合规 '+dBadge(D.compliant,D1.compliant,'up')+' ｜ 不合规 '+dBadge(D.noncompliant,D1.noncompliant,'down')+' ｜ 合规率 '+dPP(rT,r1);
  }
  var branch_rows="";
  Object.keys(D.branch_stat).sort(function(a,b){return (D.branch_stat[b].noncomp-D.branch_stat[a].noncomp)||(D.branch_stat[b].count-D.branch_stat[a].count);}).forEach(function(br){
    var v=D.branch_stat[br]; var v1=D1?D1.branch_stat[br]:null;
    branch_rows+='<tr><td><b>'+br+'</b></td>'
      +'<td style="text-align:right;color:#1a9e4b">'+fmt(v.stores_comp)+'</td>'
      +'<td style="text-align:right;color:#c0392b">'+fmt(v.stores_noncomp)+'</td>'
      +'<td style="text-align:right;color:#1a9e4b"><b>'+(v.perfect_pct||0)+'%</b></td>'
      +'<td style="text-align:right">'+fmt(v.count)+'</td>'
      +'<td style="text-align:right;color:#1a9e4b">'+fmt(v.comp)+'</td>'
      +'<td style="text-align:right;color:#c0392b"><b>'+fmt(v.noncomp)+'</b></td>'
      +'<td style="text-align:right">'+dBadge(v.noncomp,v1&&v1.noncomp,'down')+'</td></tr>';
  });
  var store_rows="";
  Object.keys(D.store_stat).filter(function(s){return D.store_stat[s].noncomp>0;}).sort(function(a,b){return D.store_stat[b].noncomp-D.store_stat[a].noncomp;}).forEach(function(s){
    var v=D.store_stat[s]; var v1=D1?D1.store_stat[s]:null;
    store_rows+='<tr><td>'+s+'</td><td style="text-align:right">'+fmt(v.count)+'</td><td style="text-align:right">'+fmt(v.comp)+'</td><td style="text-align:right;color:#c0392b"><b>'+fmt(v.noncomp)+'</b></td><td style="text-align:right;color:#888">'+fmt(v.excl)+'</td><td style="text-align:right">'+v.rate+'%</td><td style="text-align:right">'+dBadge(v.noncomp,v1&&v1.noncomp,'down')+'</td></tr>';
  });
  var chan_rows="";
  Object.keys(D.channel_stat).sort(function(a,b){return D.channel_stat[b].count-D.channel_stat[a].count;}).slice(0,40).forEach(function(ch){
    var v=D.channel_stat[ch]; var v1=D1?D1.channel_stat[ch]:null;
    chan_rows+='<tr><td>'+ch+'</td><td style="text-align:right">'+fmt(v.count)+'</td><td style="text-align:right;color:#1a9e4b">'+fmt(v.cat["合规"]||0)+'</td><td style="text-align:right;color:#c0392b">'+fmt(v.cat["不合规"]||0)+'</td><td style="text-align:right;color:#888">'+fmt(v.cat["剔除"]||0)+'</td><td style="text-align:right">'+dBadge(v.cat["不合规"]||0,v1&&v1.cat&&v1.cat["不合规"]||0,'down')+'</td></tr>';
  });
  var perfect=Object.keys(D.store_stat).filter(function(s){return D.store_stat[s].noncomp===0 && D.store_stat[s].comp>0;}).sort(function(a,b){return D.store_stat[b].count-D.store_stat[a].count;});
  var total_stores=Object.keys(D.store_stat).length;
  var perfect_pct=(total_stores>0)? Math.round(perfect.length/total_stores*1000)/10 : 0;
  var perfect_rows=perfect.map(function(s){var v=D.store_stat[s];return '<tr><td>'+s+'</td><td style="text-align:right">'+fmt(v.count)+'</td><td style="text-align:right;color:#1a9e4b">'+fmt(v.comp)+'</td><td style="text-align:right;color:#1a9e4b"><b>100%</b></td></tr>';}).join("");
  var html=kpi
    +'<div class="sec"><h2>按所属分公司（当月累积 · 右列为日环比对比前一天）</h2><table><thead><tr><th>所属分公司</th><th style="text-align:right">合规门店数量</th><th style="text-align:right">不合规门店数量</th><th style="text-align:right">100%合规门店占比</th><th style="text-align:right">笔数</th><th style="text-align:right">合规</th><th style="text-align:right">不合规</th><th style="text-align:right">对比昨日增加</th></tr></thead><tbody>'+(branch_rows||'<tr><td colspan=8 style="text-align:center;color:#1a9e4b">✅ 各分公司均合规</td></tr>')+'</tbody></table></div>'
    +'<div class="sec"><h2>按门店（当月累积 · 右列为日环比对比前一天）</h2><table><thead><tr><th>销售门店</th><th style="text-align:right">笔数</th><th style="text-align:right">合规</th><th style="text-align:right">不合规</th><th style="text-align:right">剔除</th><th style="text-align:right">门店合规率</th><th style="text-align:right">不合规Δ</th></tr></thead><tbody>'+(store_rows||'<tr><td colspan=7 style="text-align:center;color:#1a9e4b">✅ 各门店均合规</td></tr>')+'</tbody></table></div>'
    +'<div class="sec"><h2>按支付通道分布（Top40 · 右列为日环比对比前一天不合规Δ）</h2><table><thead><tr><th>支付通道</th><th style="text-align:right">笔数</th><th style="text-align:right">合规</th><th style="text-align:right">不合规</th><th style="text-align:right">剔除</th><th style="text-align:right">不合规Δ</th></tr></thead><tbody>'+chan_rows+'</tbody></table></div>'
    +'<div class="sec"><h2>✅ 100% 合规门店（共 '+fmt(perfect.length)+' 家 / 占全部 '+fmt(total_stores)+' 家门店的 '+perfect_pct+'%）</h2><p style="font-size:13px;color:#667;margin:0 0 10px;line-height:1.7">以下门店在统计日<b>合规收款笔数 &gt; 0</b> 且 <b>不合规笔数 = 0</b>，即 100% 合规。</p><table><thead><tr><th>销售门店</th><th style="text-align:right">收款笔数</th><th style="text-align:right">合规</th><th style="text-align:right">门店合规率</th></tr></thead><tbody>'+(perfect_rows||'<tr><td colspan=4 style="text-align:center;color:#c0392b">暂无 100% 合规门店</td></tr>')+'</tbody></table></div>'
    +'<div class="sec"><h2>不合规概览（共 '+fmt(D.noncompliant)+' 笔）</h2><p style="font-size:13px;color:#667;margin:0 0 10px;line-height:1.7">逐笔明细（单据、门店、会员号等）可下载 CSV 查看；不合规按所属分公司分布见上方表格。</p><button class="dlbtn" onclick="downloadCSV()">⬇ 下载不合规明细 CSV</button></div>'
    +'<div class="note">'
    +'· 已剔除<b>退货订单</b> <b>'+fmt(D.excluded_return)+'</b> 笔（不计入任何统计）。<br>'
    +'· 已剔除门店名含「ASP」的结算明细 <b>'+fmt(D.excluded_asp)+'</b> 笔（不计入任何统计）。<br>'
    +'· 已剔除门店所属分公司在映射表中标记为「剔除」的结算明细 <b>'+fmt(D.excluded_branch)+'</b> 笔（不计入任何统计）。<br>'
    +'判定规则（依据《通报商品分类-新.xlsx·收款分类》，随规则表动态更新）：<br>'
    +ruleDesc()+'· 规则未覆盖（sheet3 无此支付通道）单列示，不计入合规率分母。</div>';
  document.getElementById('content').innerHTML=html;
}
function ruleDesc(){
  var groups={合规:[],不合规:[],"有条件合规":[],剔除:[]};
  for(var ch in RULE_MAP){ var c=RULE_MAP[ch]; if(c==="剔除")groups["剔除"].push(ch); else if(c==="不合规")groups["不合规"].push(ch); else if(c==="有三方单号的视为合规")groups["有条件合规"].push(ch); else groups["合规"].push(ch); }
  function L(l,items,note){ if(!items.length)return ""; return "· <b>"+l+"</b>："+items.join(", ")+(note||"")+"<br>\n"; }
  return L("合规",groups["合规"])+L("不合规",groups["不合规"])+L("有条件合规",groups["有条件合规"],"——有「第三方订单号」才合规，否则不合规")+L("剔除",groups["剔除"],"（非收款方式）");
}
function downloadCSV(){
  var rows=getCurrentRows(); if(!rows.length){ alert("当前无不合格明细"); return; }
  var cols=["单据日期","业务组织","所属分公司","销售门店","单据编号","支付通道","收款方式","收款类型","会员手机号","第三方订单号","判定"];
  var esc=function(s){ s=String(s==null?"":s); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
  var lines=[cols.join(",")];
  rows.forEach(function(r){ lines.push(cols.map(function(c){return esc(r[c]);}).join(",")); });
  var blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="不合规明细_"+TKEY+".csv"; a.click();
}
var _CURRENT_ROWS=[];
function getCurrentRows(){ return _CURRENT_ROWS; }

(function(){
  var content=document.getElementById('content');
  if(INDEX.length===0){ content.innerHTML='<div class="note">暂无可用数据</div>'; document.getElementById('period').textContent='（无数据）'; return; }
  var dates=INDEX.slice().sort();
  var T=dates[dates.length-1];
  var T1=(INDEX.indexOf(prevKey(T))>=0)? prevKey(T) : (dates.length>1? dates[dates.length-2] : null);
  // 当月累积：D = 1号~T 全部日聚合；D1 = 1号~T1 全部日聚合；D-D1 = 当日(T)日环比增量
  var mtdT = dates.filter(function(d){ return d <= T; });
  var mtdT1 = T1 ? dates.filter(function(d){ return d <= T1; }) : [];
  var D = aggregate(mtdT.map(function(k){ return DAILY[k]; }));
  var D1 = mtdT1.length ? aggregate(mtdT1.map(function(k){ return DAILY[k]; })) : null;
  TKEY=T;
  _CURRENT_ROWS=D.noncompliant_rows;
  draw(D, D1, T, T1);
  var firstDay = mtdT[0];
  document.getElementById('period').textContent='统计区间（当月累积）：'+keyToYmd(firstDay)+' ~ '+keyToYmd(T)+(T1?(' ｜ 日环比对比前一天：'+keyToYmd(T1)):'（无前日数据，无法对比）');
  document.getElementById('noteUpd').textContent=GENERATED? ('数据更新于 '+GENERATED):'';
})();
