<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>收银合规看板</title>
<style>
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%!important;} body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f5f7fa;color:#1f2d3d;-webkit-text-size-adjust:100%!important;}
.head{background:linear-gradient(120deg,#1AABCB,#1488a8);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.head h1{margin:0;font-size:21px} .head p{margin:3px 0 0;opacity:.92;font-size:12.5px}
.kpis{display:flex;gap:14px;padding:18px 24px;flex-wrap:wrap}
.card{background:#fff;border-radius:12px;padding:16px 20px;flex:1;min-width:150px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card .n{font-size:28px;font-weight:700} .card .l{font-size:12.5px;color:#667} .card.bad .n{color:#c0392b} .card.good .n{color:#1a9e4b}
.card .d{display:block;margin-top:6px;font-size:12px;font-weight:700;color:#9ca3af}
.sec{background:#fff;margin:0 24px 18px;border-radius:12px;padding:14px 18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.sec h2{font-size:15.5px;margin:0 0 10px;color:#1AABCB;border-left:4px solid #F6AA00;padding-left:10px;display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:6px 8px;border-bottom:1px solid #eef;text-align:left}
th{background:#f0f6f8;color:#456} tbody tr:hover{background:#fafdff}
.note{font-size:12px;color:#889;padding:0 24px 22px;line-height:1.7}
.dlbtn{display:inline-block;margin:0 0 10px;font-size:13px;font-weight:600;color:#fff;background:#1AABCB;text-decoration:none;padding:8px 16px;border-radius:9px;border:0;cursor:pointer}
.dlbtn:hover{background:#1488a8}
#mwrap{padding:0 24px 8px;font-size:13px;color:#456} #period{font-weight:600;color:#1488a8}
.cmp{margin:0 24px 6px;background:#fff;border-radius:12px;padding:12px 18px;font-size:13px;color:#456;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.cmp b{color:#1488a8}
.ct-btns{display:flex;gap:8px;margin:10px 0 6px;flex-wrap:wrap;}
.ct-btn{border:1px solid #e5e9ef;background:#fff;border-radius:20px;padding:6px 16px;font-size:13px;font-weight:600;color:#4b5563;cursor:pointer;transition:all .12s;}
.ct-btn:hover{background:#eef0fe;}
.ct-btn.ct-act{background:#F6AA00;color:#fff;border-color:#F6AA00;}
  .legend{font-size:12.5px;color:#6b7280;margin-bottom:12px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;}
  .trend-btns{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .trend-btn{border:1px solid #e5e9ef;background:#fff;border-radius:20px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;color:#4b5563;transition:all .15s;}
  .trend-btn.active{background:#c0392b;color:#fff;border-color:#c0392b;}
  .trend-btn:not(.active):hover{background:#fdecea;}
  #valTrend{display:block;width:100%;cursor:default;}
  .vt-tip{position:absolute;z-index:20;display:none;pointer-events:none;background:rgba(17,24,39,.94);color:#fff;border-radius:8px;padding:8px 11px;font-size:12px;line-height:1.6;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.22);}
  .vt-tip .vt-tip-d{font-weight:700;margin-bottom:3px;font-size:12.5px;}
  .vt-tip .vt-tip-row{color:#d1d5db;}
  .vt-tip .vt-tip-row b{color:#fff;font-size:13px;}
  /* ── 移动端/云之家WebView适配：统一缩小 ── */
  @media(max-width:768px){
    body{padding:12px 10px;}
    .head h1{font-size:16px;} .head p{font-size:10px;}
    .card .n{font-size:20px;} .card .l{font-size:9.5px;} .card .d{font-size:9.5px;}
    .sec h2{font-size:12.5px;}
    .note{font-size:11px;}
    .dlbtn{font-size:12px;}
    #mwrap{font-size:11px;}
    .cmp{font-size:11px;}
    .ct-btn{font-size:11px;}
    .legend{font-size:11px;}
    .trend-btn{font-size:11px;}
    .sec p{font-size:11px!important;} /* 覆盖 JS 内联 font-size:13px */
    table,th,td{font-size:10.5px;} th,td{padding:6px 8px;}
    .vt-tip,.vt-tip .vt-tip-d,.vt-tip .vt-tip-row b{font-size:10px;}
  }
</style></head><body>
<div class="head">

</div>

  <button class="ct-btn" data-p="week">本周</button>
  <button class="ct-btn" data-p="lastweek">上周</button>
  <button class="ct-btn ct-act" data-p="month">本月</button>
  <button class="ct-btn" data-p="lastmonth">上月</button>
</div>
<div class="cmp" id="cmp" style="display:none"></div>
<div id="content"><div class="note">加载中…</div></div>

    store_rows+='<tr><td>'+s+'</td><td style="text-align:right">'+fmt(v.count)+'</td><td style="text-align:right">'+fmt(v.comp)+'</td><td style="text-align:right;color:#c0392b"><b>'+fmt(v.noncomp)+'</b></td><td style="text-align:right;color:#888">'+fmt(v.excl)+'</td><td style="text-align:right">'+v.rate+'%</td><td style="text-align:right">'+dBadge(v.noncomp,v1&&v1.noncomp,'down')+'</td></tr>';
  });
  var chan_rows="";
  Object.keys(D.channel_stat).sort(function(a,b){return D.channel_stat[b].count-D.channel_stat[a].count;}).slice(0,40).forEach(function(ch){
    var v=D.channel_stat[ch]; var v1=D1?D1.channel_stat[ch]:null;
    chan_rows+='<tr><td>'+ch+'</td><td style="text-align:right">'+fmt(v.count)+'</td><td style="text-align:right;color:#1a9e4b">'+fmt(v.cat["合规"]||0)+'</td><td style="text-align:right;color:#c0392b">'+fmt(v.cat["不合规"]||0)+'</td><td style="text-align:right;color:#888">'+fmt(v.cat["剔除"]||0)+'</td><td style="text-align:right">'+dBadge(v.cat["不合规"]||0,v1&&v1.cat&&v1.cat["不合规"]||0,'down')+'</td></tr>';
  });
  var perfect=Object.keys(D.store_stat).filter(function(s){return D.store_stat[s].noncomp===0 && D.store_stat[s].comp>0;}).sort(function(a,b){return D.store_stat[b].count-D.store_stat[a].count;});
  var total_stores=Object.keys(D.store_stat).length;
  var perfect_pct=(total_stores>0)? Math.round(perfect.length/total_stores*1000)/10 : 0;
  var perfect_rows=perfect.map(function(s){var v=D.store_stat[s];return '<tr><td>'+s+'</td><td style="text-align:right">'+fmt(v.count)+'</td><td style="text-align:right;color:#1a9e4b">'+fmt(v.comp)+'</td><td style="text-align:right;color:#1a9e4b"><b>100%</b></td></tr>';}).join("");
  var html=kpi
    +'<div class="sec"><h2>不合规数量趋势（每日）</h2>'
    +'<div class="legend"><span><i class="dot" style="background:#c0392b"></i>每日不合规笔数</span></div>'
    +'<div class="trend-btns"><button class="trend-btn active" data-vt-branch="全部">全部</button></div>'
    +'<div style="position:relative;width:100%;height:320px;"><canvas id="valTrend"></canvas><div id="vtTip" class="vt-tip"></div></div></div>'
    +'<div class="sec"><h2>按所属分公司（当月累积 · 右列为日环比对比前一天）</h2><table><thead><tr><th>所属分公司</th><th style="text-align:right">合规门店数量</th><th style="text-align:right">不合规门店数量</th><th style="text-align:right">100%合规门店占比</th><th style="text-align:right">笔数</th><th style="text-align:right">合规</th><th style="text-align:right">不合规</th><th style="text-align:right">不合规占比</th><th style="text-align:right">对比昨日增加</th></tr></thead><tbody>'+(branch_rows||'<tr><td colspan=9 style="text-align:center;color:#1a9e4b">✅ 各分公司均合规</td></tr>')+'</tbody></table></div>'
    +'<div class="sec"><h2>按门店（当月累积 · 右列为日环比对比前一天）</h2><table><thead><tr><th>销售门店</th><th style="text-align:right">笔数</th><th style="text-align:right">合规</th><th style="text-align:right">不合规</th><th style="text-align:right">剔除</th><th style="text-align:right">门店合规率</th><th style="text-align:right">不合规Δ</th></tr></thead><tbody>'+(store_rows||'<tr><td colspan=7 style="text-align:center;color:#1a9e4b">✅ 各门店均合规</td></tr>')+'</tbody></table></div>'
    +'<div class="sec"><h2>按支付通道分布（Top40 · 右列为日环比对比前一天不合规Δ）</h2><table><thead><tr><th>支付通道</th><th style="text-align:right">笔数</th><th style="text-align:right">合规</th><th style="text-align:right">不合规</th><th style="text-align:right">剔除</th><th style="text-align:right">不合规Δ</th></tr></thead><tbody>'+chan_rows+'</tbody></table></div>'
    +'<div class="sec"><h2>✅ 100% 合规门店（共 '+fmt(perfect.length)+' 家 / 占全部 '+fmt(total_stores)+' 家门店的 '+perfect_pct+'%）</h2><p style="font-size:13px;color:#667;margin:0 0 10px;line-height:1.7">以下门店在统计日<b>合规收款笔数 &gt; 0</b> 且 <b>不合规笔数 = 0</b>，即 100% 合规。</p><table><thead><tr><th>销售门店</th><th style="text-align:right">收款笔数</th><th style="text-align:right">合规</th><th style="text-align:right">门店合规率</th></tr></thead><tbody>'+(perfect_rows||'<tr><td colspan=4 style="text-align:center;color:#c0392b">暂无 100% 合规门店</td></tr>')+'</tbody></table></div>'
    +'<div class="sec"><h2>不合规概览（共 '+fmt(D.noncompliant)+' 笔）</h2><p style="font-size:13px;color:#667;margin:0 0 10px;line-height:1.7">逐笔明细（单据、门店、会员号等）可下载 CSV 查看；不合规按所属分公司分布见上方表格。</p><button class="dlbtn" onclick="downloadCSV()">⬇ 下载不合规明细 CSV</button></div>'
    +'<div class="note">'
    +'· 已剔除<b>退货订单</b> <b>'+fmt(D.excluded_return)+'</b> 笔（不计入任何统计）。<br>'
    +'· 已剔除门店名含「ASP」的结算明细 <b>'+fmt(D.excluded_asp)+'</b> 笔（不计入任何统计）。<br>'
    +'· 已剔除门店所属分公司在映射表中标记为「剔除」的结算明细 <b>'+fmt(D.excluded_branch)+'</b> 笔（不计入任何统计）。<br>'
    +'判定规则（依据《通报商品分类-新.xlsx·收款分类》，随规则表动态更新）：<br>'
    +ruleDesc()+'· 规则未覆盖（sheet3 无此支付通道）单列示，不计入合规率分母。</div>';
  document.getElementById('content').innerHTML=html;
}
function ruleDesc(){
  var groups={合规:[],不合规:[],"有条件合规":[],剔除:[]};
  for(var ch in RULE_MAP){ var c=RULE_MAP[ch]; if(c==="剔除")groups["剔除"].push(ch); else if(c==="不合规")groups["不合规"].push(ch); else if(c==="有三方单号的视为合规")groups["有条件合规"].push(ch); else groups["合规"].push(ch); }
  function L(l,items,note){ if(!items.length)return ""; return "· <b>"+l+"</b>："+items.join(", ")+(note||"")+"<br>\n"; }
  return L("合规",groups["合规"])+L("不合规",groups["不合规"])+L("有条件合规",groups["有条件合规"],"——有「第三方订单号」才合规，否则不合规")+L("剔除",groups["剔除"],"（非收款方式）");
}
function downloadCSV(){
  var rows=getCurrentRows();
  var go=function(rows){
    if(!rows||!rows.length){ alert("当前无不合格明细"); return; }
    var cols=["单据日期","业务组织","所属分公司","销售门店","单据编号","支付通道","收款方式","收款类型","会员手机号","第三方订单号","判定"];
    var esc=function(s){ s=String(s==null?"":s); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
    var lines=[cols.join(",")];
    rows.forEach(function(r){ lines.push(cols.map(function(c){return esc(r[c]);}).join(",")); });
    var blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="不合规明细_"+TKEY+".csv"; a.click();
  };
  if(rows&&rows.length){ go(rows); return; }
  fetch("daily/noncompliant_"+T+".json").then(function(r){return r.json();}).then(go).catch(function(){ alert("明细加载失败"); });
}
var _CURRENT_ROWS=[];
function getCurrentRows(){ return _CURRENT_ROWS; }

function _cm(k){ return k? (k.slice(4,6)+'-'+k.slice(6,8)) : ''; }      // 'YYYYMMDD' -> 'MM-DD'
function _prevCm(k){ if(!k) return ''; var dt=new Date(k.slice(0,4)+'-'+k.slice(4,6)+'-'+k.slice(6,8)); dt.setDate(dt.getDate()-1); return ('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2); }
// 「当日/昨日」跟随数据最新日：day=最新一天，yest=其前一天（按钮与统计行直接显示日期，不再显示中文）
var _dayT=(window.PERIODS&&PERIODS.day&&PERIODS.day.dates&&PERIODS.day.dates[0])||null;
var _yestT=(window.PERIODS&&PERIODS.yest&&PERIODS.yest.dates&&PERIODS.yest.dates[0])||(_dayT? _prevCm(_dayT):null);
var _P_LABELS_C={day:_cm(_dayT)||'当日',yest:_cm(_yestT)||'昨日',week:'本周',lastweek:'上周',month:'本月',lastmonth:'上月'};

function renderPeriod(p){
  var P = (window.PERIODS && PERIODS[p]);
  if(!P || !P.D){ return; }
  window.CUR_DATES = P.dates;
  draw(P.D, P.D1, P.T, P.T1);
  var label = _P_LABELS_C[p]||p;
  // 周期文字：当日=数据里最新的一天，昨日=其前一天，本周/本月/上月口径不变
  var rng = (P.dates&&P.dates.length>1)? (keyToMd(P.dates[0])+' ~ '+keyToMd(P.dates[P.dates.length-1])) : '';
  document.getElementById('period').innerHTML = label+(rng?('　'+rng):'')+'　共 '+((P.dates&&P.dates.length)||0)+' 天';
  var btns=document.getElementById('periodBtns');
  if(btns){ btns.querySelectorAll('.ct-btn').forEach(function(b){ b.classList.toggle('ct-act', b.getAttribute('data-p')===p); }); }
  drawTrend();
}
(function(){
  var content=document.getElementById('content');
  if(!D){ content.innerHTML='<div class="note">暂无可用数据</div>'; document.getElementById('period').textContent='（无数据）'; return; }
  renderPeriod('month');
  document.getElementById('noteUpd').textContent=GENERATED? ('数据更新于 '+GENERATED):'';
  var pb=document.getElementById('periodBtns');
  if(pb){ pb.querySelectorAll('.ct-btn').forEach(function(b){ var k=b.getAttribute('data-p'); if(_P_LABELS_C[k]) b.textContent=_P_LABELS_C[k]; }); pb.addEventListener('click', function(e){ var b=e.target.closest('.ct-btn'); if(!b) return; renderPeriod(b.getAttribute('data-p')); }); }
})();
function drawTrend(){
  var cv=document.getElementById('valTrend');
  if(!cv||!window.TREND||!TREND.length) return;
  var activeBranch='全部';
  var gPts=[];
  var tip=cv.parentElement.querySelector('#vtTip');
  var _src = (window.CUR_DATES && window.CUR_DATES.length) ? TREND.filter(function(d){return window.CUR_DATES.indexOf(d.date)>=0;}) : TREND.slice();
  _src = _src.slice(-14);
  function fmt(n){ n=Math.round(n||0); return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,','); }
  function fmtDay(ds){ var m=String(ds).match(/(\d{1,2})$/); return (m?m[1]:ds)+'日'; }

  // 动态生成分公司按钮（与会员有效性一致）
  var btnContainer=cv.closest('.sec').querySelector('.trend-btns');
  if(btnContainer){
    // 清空上次动态添加的分公司按钮（保留首个「全部」），避免切换周期时重复
    var _ex=btnContainer.querySelectorAll('.trend-btn');
    for(var _i=_ex.length-1;_i>0;_i--){ btnContainer.removeChild(_ex[_i]); }
    var bSet={};
    _src.forEach(function(p){ if(p.branches){ Object.keys(p.branches).forEach(function(b){bSet[b]=1;}); } });
    var bNames=Object.keys(bSet).sort();
    bNames.forEach(function(b){
      var btn=document.createElement('button');
      btn.className='trend-btn'; btn.setAttribute('data-vt-branch',b); btn.textContent=b;
      btnContainer.appendChild(btn);
    });
    if(!btnContainer._bound){
      btnContainer.addEventListener('click', function(e){
        var tb=e.target.closest('.trend-btn'); if(!tb) return;
        btnContainer.querySelectorAll('.trend-btn').forEach(function(b){b.classList.remove('active');});
        tb.classList.add('active');
        activeBranch=tb.getAttribute('data-vt-branch');
        drawCt();
      });
      btnContainer._bound=true;
    }
  }

  function drawCt(){
    var w=cv.clientWidth, h=320, dpr=window.devicePixelRatio||1;
    cv.width=w*dpr; cv.height=h*dpr;
    var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    var pl=48,pr=48,pt=18,pb=40, cw=w-pl-pr, ch=h-pt-pb, n=_src.length;
    if(!n) return;
    if(tip) tip.style.display='none';
    gPts=[];
    var data=_src.map(function(d){
      var row={date:d.date.slice(4)};
      if(activeBranch==='全部'||!d.branches){ row.invalid=d.invalid||0; }
      else{ var br=d.branches[activeBranch]; row.invalid=br?br.invalid:0; }
      return row;
    });
    var maxV=0; data.forEach(function(d){maxV=Math.max(maxV,d.invalid||0);});
    maxV=Math.ceil(maxV/10)*10||10;
    ctx.strokeStyle='#eef0f3'; ctx.fillStyle='#9aa3ad'; ctx.font='11px sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    for(var i=0;i<=5;i++){var val=maxV*i/5,y=pt+ch-val/maxV*ch;ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(pl+cw,y);ctx.stroke();ctx.fillText(val,pl-6,y);}
    ctx.textAlign='center'; ctx.textBaseline='top';
    var step=n>1?cw/(n-1):0;
    // 日期竖向显示（防手机叠压）
    data.forEach(function(d,i){var x=pl+step*i; ctx.save(); ctx.translate(x,pt+ch+6); ctx.rotate(-Math.PI/2); ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillText(fmtDay(d.date),0,0); ctx.restore();});
    // 固定显示当前维度「当日」不合规笔数（与折线一致，每天变化，非区间累计）
    var lastV=data[data.length-1].invalid||0;
    ctx.fillStyle='#c0392b'; ctx.font='bold 13px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('当日: '+fmt(lastV)+' 笔', pl, pt-2);
    ctx.fillStyle='#9aa3ad'; ctx.font='10px sans-serif';
    ctx.fillText(activeBranch==='全部'?'(全部)': '('+activeBranch+')', pl, pt+12);
    data.forEach(function(d,i){ var x=pl+step*i, v=d.invalid||0, y=pt+ch-v/maxV*ch; gPts.push({x:x,y:y,date:d.date,invalid:v,p:_src[i]}); });
    function plot(key,color,width){
      ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath(); var st=false;
      data.forEach(function(d,i){var x=pl+step*i;var v=d[key];if(v==null||v==undefined){st=false;return;}var y=pt+ch-v/maxV*ch;if(!st){ctx.moveTo(x,y);st=true;}else ctx.lineTo(x,y);});
      ctx.stroke();
      data.forEach(function(d,i){var v=d[key];if(v==null||v==undefined)return;var x=pl+step*i;var y=pt+ch-v/maxV*ch;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.stroke();});
    }
    plot('invalid','#c0392b',2.6);
  }

  function showTip(pt){
    var p=pt.p;
    var html='<div class="vt-tip-d">'+p.date+'</div>';
    if(activeBranch==='全部'){
      html+='<div class="vt-tip-row">不合规笔数：<b>'+fmt(pt.invalid)+'</b></div>';
      html+='<div class="vt-tip-row">合规笔数：'+fmt(p.valid||0)+'</div>';
      html+='<div class="vt-tip-row">总笔数：'+fmt(p.total||0)+'</div>';
    } else {
      var br=p.branches?p.branches[activeBranch]:null;
      html+='<div class="vt-tip-row">'+activeBranch+' 不合规笔数：<b>'+fmt(br?br.invalid:0)+'</b></div>';
      if(br){ html+='<div class="vt-tip-row">合规笔数：'+fmt(br.valid||0)+'</div>'; html+='<div class="vt-tip-row">总笔数：'+fmt(br.total||0)+'</div>'; }
    }
    tip.innerHTML=html; tip.style.display='block';
    var tw=tip.offsetWidth, th=tip.offsetHeight, rect=cv.getBoundingClientRect();
    var left=pt.x+14; if(left+tw>rect.width) left=pt.x-tw-14; if(left<0) left=4;
    var top=pt.y-th-12; if(top<0) top=pt.y+16;
    tip.style.left=left+'px'; tip.style.top=top+'px';
  }
  function hitTest(mx,my){ var best=-1,bd=1e9; for(var i=0;i<gPts.length;i++){var dx=gPts[i].x-mx,dy=gPts[i].y-my,dd=dx*dx+dy*dy; if(dd<bd){bd=dd;best=i;}} return (best>=0&&bd<=196)?best:-1; }
  cv.addEventListener('click', function(e){
    var rect=cv.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
    var idx=hitTest(mx,my);
    if(idx>=0) showTip(gPts[idx]); else if(tip) tip.style.display='none';
  });
  cv.addEventListener('mousemove', function(e){
    var rect=cv.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
    cv.style.cursor = hitTest(mx,my)>=0 ? 'pointer' : 'default';
  });

  drawCt();
}
