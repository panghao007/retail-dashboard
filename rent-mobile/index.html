<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#274FC4">
<title>门店 GMV · 手机看板</title>
<style>
:root{--blue:#274FC4;--blue-d:#1B3A96;--blue-l:#F4F8FF;--blue-b:#DCE7FF;
--ink:#182338;--ink2:#4A5876;--ink3:#8492AD;--line:#E6ECF7;--bg:#F7F9FD;--white:#FFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
font-size:14px;-webkit-text-size-adjust:100%}
body{max-width:480px;margin:0 auto;min-height:100vh;box-shadow:0 0 0 1px var(--line)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.top{height:4px;background:linear-gradient(90deg,var(--blue),#5B83EC 60%,#E8900C)}
.hd{position:sticky;top:0;z-index:20;background:var(--white);
border-bottom:1px solid var(--line);padding:12px 14px 10px;padding-top:calc(12px + env(safe-area-inset-top))}
.hd h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.3px}
.hd .sub{color:var(--ink3);font-size:11px;margin-top:3px}
.row1{display:flex;align-items:center;gap:8px;margin-top:10px}
select,input{font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);
border:1px solid var(--line);border-radius:9px;height:36px;padding:0 10px;outline:none}
select{flex:1;min-width:0;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
background-position:calc(100% - 16px) 15px,calc(100% - 11px) 15px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
input{flex:1;min-width:0}
/* 起止日期：原生日历选择器（手机上点开即日历） */
.rng{display:flex;align-items:center;gap:6px;width:100%}
.rng input{flex:1;min-width:0;text-align:center;font-size:13px;padding:0 6px;height:36px}
.rng .tilde{flex:0 0 auto;color:var(--ink3);font-size:13px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink2);font-size:12px;padding:9px 12px;font-family:inherit}
.seg button.on{background:var(--blue);color:#fff;font-weight:600}
.row2{display:flex;align-items:center;gap:8px;margin-top:8px}
.row2 .seg{flex:0 0 auto}
/* 分公司 / 体系 筛选 */
.rowF{display:flex;align-items:center;gap:8px;margin-top:8px}
.rowF select{flex:1;min-width:0}
.card .tags{display:flex;flex-wrap:wrap;gap:5px;margin:-2px 0 8px}
.card .tags span{font-size:10px;color:var(--ink2);background:var(--bg);
border:1px solid var(--line);border-radius:6px;padding:2px 6px;line-height:1.4}
.row3{display:flex;align-items:center;gap:8px;margin-top:8px}
.filt{flex:0 0 auto;border:1px solid #F0C98A;background:#FFF7E8;color:#8A5600;
border-radius:9px;padding:8px 11px;font-size:12px;font-family:inherit;line-height:1.2}
.filt b{font-weight:700;font-variant-numeric:tabular-nums}
.filt.on{background:#B26A00;border-color:#B26A00;color:#fff;font-weight:650}
.filt:disabled{opacity:.55}
.fdesc{font-size:10px;color:var(--ink3);flex:1;min-width:0;line-height:1.35}
.vw{margin-left:auto;font-size:12px;color:var(--blue);background:var(--blue-l);
border:1px solid var(--blue-b);border-radius:9px;padding:9px 12px;font-family:inherit}
.grid{display:grid;grid-template-columns:38px minmax(0,1fr) minmax(0,1fr);gap:3px 8px;align-items:baseline}
.grid>*{min-width:0}
.grid .lb{font-size:11px;color:var(--ink3);text-align:right}
.grid .h{font-size:11px;color:var(--ink3);text-align:right;font-weight:600}
.grid b{font-size:14px;font-weight:650;text-align:right;color:var(--ink);letter-spacing:-.2px;white-space:nowrap}
.grid b.rep{color:var(--blue)}
.wrap{padding:10px 12px 28px}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;
padding:11px 12px 12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(24,35,56,.03)}
.card .ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
padding-bottom:9px;margin-bottom:9px;border-bottom:1px dashed var(--line)}
.card .nm{font-size:14px;font-weight:650;line-height:1.35;word-break:break-all}
.card .dt{font-size:11px;color:var(--ink3);flex:0 0 auto}
.card .grid b{font-size:15px}
.meta{display:flex;align-items:baseline;justify-content:space-between;gap:6px;
margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);
font-size:11px;color:var(--ink3)}
.meta span{white-space:nowrap}
.meta b{font-size:12px;color:var(--ink);font-weight:650;margin-left:5px}
.meta b.must{color:var(--blue);font-size:13px}
.meta .hint{font-size:10px;color:var(--ink3)}
.meta.over b.ov{color:#B26A00;font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--white);
border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12px}
th,td{padding:9px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid #F1F4FA}
th{background:#F5F8FE;color:var(--ink2);font-weight:600;position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--white);
max-width:150px;overflow:hidden;text-overflow:ellipsis}
th:first-child{background:#F5F8FE}
td.r{color:var(--blue)}
td.ovc{color:#B26A00;font-weight:600}
.tbox{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
.empty{text-align:center;color:var(--ink3);padding:36px 10px;font-size:13px}
.note{color:var(--ink3);font-size:11px;line-height:1.7;padding:0 14px calc(24px + env(safe-area-inset-bottom))}
.note b{color:var(--ink2)}
.warn{background:#FFF5E3;border:1px solid #F6DFB4;color:#8A5600;border-radius:9px;
padding:8px 11px;font-size:11px;margin:10px 12px 0;line-height:1.55}
.more{display:block;width:100%;padding:12px;border:1px solid var(--blue-b);border-radius:10px;
background:var(--blue-l);color:var(--blue);font-size:13px;font-family:inherit;margin-top:6px}
</style>
</head>

<div class="top"></div>
<div class="hd">
  <h1 id="hTitle">门店 GMV</h1>

  <div class="row2">

    <input id="q" type="search" placeholder="搜索门店名称" autocomplete="off">
    <button class="vw" id="vw">表格</button>

  <div class="row3">
    <button class="filt" id="fOver">预计本月超限 <b id="fCnt">0</b> 家</button>
    <span class="fdesc" id="fDesc">—</span>
  </div>
</div>
<div id="warn"></div>
<div class="wrap" id="list"></div>
<div class="note" id="note"></div>

    const head='<th>门店名称</th><th>分公司</th><th>体系</th><th>日期</th><th>线下GMV</th><th>线上GMV</th>'+
      (overOnly?'<th>预计超出</th>':'');
    let h='<div class="tbox"><table><thead><tr>'+head+'</tr></thead><tbody>';
    for(const [nm,v,si] of shown){
      const st=D.stores[si];
      h+='<tr><td>'+esc(nm)+'</td><td>'+esc(st[7]||'—')+'</td><td>'+esc(st[8]||'—')+'</td><td>'+label+'</td><td class="num">'+fmt(v[0])+'</td><td class="num">'+fmt(v[1])+'</td>'+
        (overOnly?'<td class="num ovc">'+fmtW(st[4])+'</td>':'')+'</tr>';
    }
    h+='</tbody></table></div>';
    if(items.length>shown.length) h+='<button class="more" id="more">加载更多（还有 '+(items.length-shown.length)+' 家）</button>';
    $('list').innerHTML=h;
    const mb=$('more'); if(mb) mb.onclick=()=>{limit+=60;render();};
  }
  $('note').innerHTML='<b>口径</b>：<b>GMV</b> = 门店销售流水净额中「已报打标」的部分（orderFlag=1），线下按 onlineOffline=线下、线上按 onlineOffline=线上；退货为负数自动冲减。本版只保留 GMV，不含实销、必报金额、本月计划、本月预估全月、线下提成界限等字段。<br>'+
    '金额单位：元，四舍五入到整数；万元金额四舍五入到整数、不带小数点；<b>全页都是区间累计</b>：起止日期之间的流水逐日累加，默认「本月」= 数据起始日 ~ 上一完整日，起止日期用日历选择器挑选，另有「近7日 / 本月 / 全区间」快捷。<br>'+
    '<b>分公司 / 体系筛选</b>：分公司取门店档案 branchCompany，体系取门店档案 mallName；两者可组合使用，切换分公司后体系只列该分公司下的体系，门店数、卡片与表格同步联动；卡片标题下方的标签即门店归属。<br>'+
    '<b>预计本月超限筛选</b> = 按 '+(FC.date||'—')+' 跑批的当日总限额、必报预估、尾号档位逐日推演到月底，月底累计 > 月上限即视为超限；这是按系统指令执行的预测，不是线性外推，也不包含门店自行多报。全集团共 '+(FC.covered||0)+' 家纳入跑批、'+(FC.count||0)+' 家预计超限（合计 '+fmtW(FC.overTotal||0)+'）；未纳入跑批的门店无预测值，筛选时不显示。开启后按预计超出金额降序。<br>'+
    '<b>超限名单随筛选器联动</b>：筛选按钮上的「N 家」与按钮右侧的合计金额均按当前「分公司 / 体系 / 门店搜索」范围内的门店实时重算；范围内无超限门店时按钮显示 0 家并置灰。<br>'+
    '来源：门店销售流水 /admin/rent/storeSale/list + 门店档案 /admin/rent/store/list + 月底超限逐日推演，取数 '+D.generated+'。数据只读取数，未修改任何业务参数。';
}
// 起止日期：原生日历选择器；快捷区间「近7日 / 本月 / 全区间」
(function(){
  const f=$('dFrom'), t=$('dTo');
  f.min=t.min=FIRST; f.max=t.max=LAST;
  f.value=dFrom; t.value=dTo;
  f.onchange=()=>{dFrom=clampD(f.value||FIRST);f.value=dFrom;clearChips();limit=40;render();};
  t.onchange=()=>{dTo=clampD(t.value||LAST);t.value=dTo;clearChips();limit=40;render();};
})();
function clearChips(){document.querySelectorAll('#chips button').forEach(x=>x.classList.remove('on'));}
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{
  clearChips(); b.classList.add('on');
  if(b.dataset.r==='mtd'){dFrom=FIRST;dTo=DEF_TO;}
  else if(b.dataset.r==='all'){dFrom=FIRST;dTo=LAST;}
  else{dTo=DEF_TO;dFrom=clampD(shiftDays(DEF_TO,-6));}
  $('dFrom').value=dFrom; $('dTo').value=dTo;
  limit=40;render();
});
$('q').oninput=e=>{q=e.target.value.trim();limit=40;render();};
// 分公司 / 体系 筛选：分公司变化时，体系下拉只列该分公司的体系
const BRANCHES=[...new Set(D.stores.map(s=>s[7]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hans-CN'));
const MALLS=[...new Set(D.stores.map(s=>s[8]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hans-CN'));
function fillMall(keep){
  const b=$('fBranch').value;
  const list=(b? [...new Set(D.stores.filter(s=>s[7]===b).map(s=>s[8]).filter(Boolean))] : MALLS)
    .sort((a,b)=>a.localeCompare(b,'zh-Hans-CN'));
  const sel=$('fMall');
  const cur=(keep!==undefined)?keep:sel.value;
  sel.innerHTML='<option value="">全部体系</option>'+list.map(m=>'<option value="'+esc(m)+'">'+esc(m)+'</option>').join('');
  sel.value=list.indexOf(cur)>=0?cur:'';
}
$('fBranch').innerHTML='<option value="">全部分公司</option>'+
  BRANCHES.map(b=>'<option value="'+esc(b)+'">'+esc(b)+'</option>').join('');
fillMall('');
$('fBranch').onchange=()=>{fBranch=$('fBranch').value; fillMall(''); fMall=$('fMall').value; limit=40; render();};
$('fMall').onchange=()=>{fMall=$('fMall').value; limit=40; render();};
$('vw').onclick=()=>{view=view==='card'?'table':'card';$('vw').textContent=view==='card'?'表格':'卡片';limit=40;render();};
const fBtn=$('fOver');
if(!FC.date){
  fBtn.disabled=true;
  $('fCnt').textContent='0';
  $('fDesc').textContent='暂无超限预测数据';
}else{
  fBtn.onclick=()=>{
    overOnly=!overOnly;
    fBtn.classList.toggle('on',overOnly);
    limit=40;render();
  };
}
// 标题连点 5 次 → 跳回完整版看板（与主版互为切换入口）
(function(){
  const h=$('hTitle'), TARGET='https://panghao007.github.io/retail-dashboard/rent-mobile-gmv/';
  if(!h||!TARGET) return;
  let n=0, timer=null;
  h.style.cursor='pointer';
  h.onclick=()=>{
    n++;
    if(timer) clearTimeout(timer);
    timer=setTimeout(()=>{n=0;},1500);
    if(n>=5){ n=0; location.href=TARGET; }
  };
})();
render();
</script>
