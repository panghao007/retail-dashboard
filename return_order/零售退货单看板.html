function agg(keys){
  var R={return_count:0,sales_count:0,return_amount:0,sales_amount:0,branch:{},store:{}};
  keys.forEach(function(k){
    var d=RDATA.daily[k]; if(!d) return;
    R.return_count+=d.return_count; R.sales_count+=d.sales_count;
    R.return_amount+=d.return_amount; R.sales_amount+=d.sales_amount;
    for(var b in d.branch){ var bb=R.branch[b]||(R.branch[b]={return_count:0,sales_count:0,return_amount:0,sales_amount:0});
      bb.return_count+=d.branch[b].return_count; bb.sales_count+=d.branch[b].sales_count;
      bb.return_amount+=d.branch[b].return_amount; bb.sales_amount+=d.branch[b].sales_amount; }
    for(var s in d.store){ var ss=R.store[s]||(R.store[s]={return_count:0,sales_count:0,return_amount:0,sales_amount:0,branch:""});
      ss.return_count+=d.store[s].return_count; ss.sales_count+=d.store[s].sales_count;
      ss.return_amount+=d.store[s].return_amount; ss.sales_amount+=d.store[s].sales_amount; ss.branch=d.store[s].branch; }
  });
  return R;
}
function windowKeys(w){
  var today=beijingYMD();
  if(w==="today") return RDATA.dates.indexOf(today)>=0?[today]:[];
  if(w==="yesterday"){ var y=shiftDays(today,1); return RDATA.dates.indexOf(y)>=0?[y]:[]; }
  if(w==="month"){ var ym=today.slice(0,6); return RDATA.dates.filter(function(k){return k.indexOf(ym)===0;}); }
  if(w==="custom"){ var f=ymdToKey(document.getElementById("dfrom").value), t=ymdToKey(document.getElementById("dto").value);
    if(!f&&!t) return []; f=f||RDATA.dates[0]; t=t||RDATA.dates[RDATA.dates.length-1];
    return RDATA.dates.filter(function(k){return k>=f&&k<=t;}); }
  return [];
}
var CURRENT_W="month";
function renderOverview(){
  var today=beijingYMD();
  var defs=[["当日",RDATA.dates.indexOf(today)>=0?[today]:[]],
            ["昨日",RDATA.dates.indexOf(shiftDays(today,1))>=0?[shiftDays(today,1)]:[]],
            ["当月",RDATA.dates.filter(function(k){return k.indexOf(today.slice(0,6))===0;})]];
  var html="";
  defs.forEach(function(d){
    var R=agg(d[1]); var r=ratePct(R.return_count,R.sales_count);
    html+='<div class="card ret"><div class="n">'+fmt(R.return_count)+'</div><div class="l">'+d[0]+' 退货单(数)</div>'
        +'<span class="r" style="color:#c0392b">退单率 '+r.toFixed(2)+'%</span></div>';
  });
  document.getElementById("overview").innerHTML=html;
}
function renderTable(w){
  var keys=windowKeys(w);
  if(w==="custom") document.getElementById("winlabel").textContent="（自定义）";
  else if(w==="today") document.getElementById("winlabel").textContent="（当日）";
  else if(w==="yesterday") document.getElementById("winlabel").textContent="（昨日）";
  else document.getElementById("winlabel").textContent="（当月）";
  var R=agg(keys);
  // 分公司
  var bArr=[]; for(var b in R.branch){ var v=R.branch[b]; bArr.push([b,v.return_count,v.sales_count,ratePct(v.return_count,v.sales_count),v.return_amount]); }
  bArr.sort(function(a,b){return b[3]-a[3];});
  var bt=''; bArr.forEach(function(r){ var rc=r[1],sc=r[2],rt=r[3];
    bt+='<tr><td>'+r[0]+'</td><td>'+fmt(rc)+'</td><td>'+fmt(sc)+'</td><td class="rate-cell '+rateClass(rt)+'">'+rt.toFixed(2)+'%</td><td>'+money(r[4])+'</td></tr>'; });
  if(!bt) bt='<tr><td colspan="5" style="text-align:center;color:#9ca">该时段无数据</td></tr>';
  document.querySelector("#tblBranch tbody").innerHTML=bt;
  // 门店（按分公司分组；每分公司默认 TOP1 退单率最高门店，更多按钮展开全部）
  var sByB={};
  for(var s in R.store){ var v=R.store[s]; (sByB[v.branch]=sByB[v.branch]||[]).push([s,v.branch,v.return_count,v.sales_count,ratePct(v.return_count,v.sales_count),v.return_amount]); }
  var st='';
  if(!bArr.length){ st='<tr><td colspan="6" style="text-align:center;color:#9ca">该时段无数据</td></tr>'; }
  else {
    bArr.forEach(function(br){
      var bn=br[0]; var sList=(sByB[bn]||[]).slice().sort(function(a,b){return b[4]-a[4];});
      if(!sList.length) return;
      st+='<tr class="brgrp" data-br="'+bn+'"><td colspan="6" style="background:#eef6f9;color:#1488a8;font-weight:700;text-align:left;padding:8px 10px">'+bn+'　退单率 '+br[3].toFixed(2)+'%　·　'+sList.length+' 家门店</td></tr>';
      sList.forEach(function(r,idx){
        var style=(idx>=10)?' style="display:none"':'';
        st+='<tr class="srow" data-br="'+bn+'"'+style+'><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+fmt(r[2])+'</td><td>'+fmt(r[3])+'</td><td class="rate-cell '+rateClass(r[4])+'">'+r[4].toFixed(2)+'%</td><td>'+money(r[5])+'</td></tr>';
      });
      if(sList.length>10){
        st+='<tr class="morerow" data-br="'+bn+'"><td colspan="6" style="text-align:center;padding:6px"><button class="morebtn" data-br="'+bn+'" data-exp="0" data-n="'+sList.length+'">更多（'+sList.length+' 家门店 ›）</button></td></tr>';
      }
    });
  }
  document.querySelector("#tblStore tbody").innerHTML=st;
  CURRENT_KEYS=keys;
}
var CURRENT_KEYS=[];
function setWin(w){
  CURRENT_W=w;
  document.querySelectorAll("#ctbtns .ct-btn").forEach(function(b){ b.classList.toggle("ct-act", b.getAttribute("data-w")===w); });
  document.getElementById("cust").style.display=(w==="custom")?"flex":"none";
  renderTable(w);
}
document.querySelectorAll("#ctbtns .ct-btn").forEach(function(b){ b.addEventListener("click",function(){ setWin(b.getAttribute("data-w")); }); });
document.getElementById("custgo").addEventListener("click",function(){ setWin("custom"); });
document.getElementById("dlcsv").addEventListener("click",function(){
  var rows=[["类型","名称","所属分公司","退货单数","销售单数","退单率(%)","退货金额"]];
  document.querySelectorAll("#tblBranch tbody tr").forEach(function(tr){ var c=tr.children; if(c.length<5) return; rows.push(["分公司",c[0].textContent,"",c[1].textContent,c[2].textContent,parseFloat(c[3].textContent)||0,parseFloat(c[4].textContent.replace(/,/g,""))||0]); });
  document.querySelectorAll("#tblStore tbody tr").forEach(function(tr){ if(tr.style.display==="none") return; var c=tr.children; if(c.length<6) return; rows.push(["门店",c[0].textContent,c[1].textContent,c[2].textContent,c[3].textContent,parseFloat(c[4].textContent)||0,parseFloat(c[5].textContent.replace(/,/g,""))||0]); });
  var lines=rows.map(function(r){return r.map(function(x){x=String(x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(",");});
  var blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="零售退货单明细_"+CURRENT_W+".csv"; a.click();
});
document.addEventListener("click", function(e){
  var t=e.target;
  if(t.classList && t.classList.contains("morebtn")){
    var bn=t.getAttribute("data-br");
    var rows=document.querySelectorAll('#tblStore tbody tr.srow[data-br="'+bn+'"]');
    if(t.getAttribute("data-exp")==="1"){
      rows.forEach(function(tr,i){ if(i>=10) tr.style.display="none"; });
      t.textContent="更多（"+t.getAttribute("data-n")+" 家门店 ›）"; t.setAttribute("data-exp","0");
    }else{
      rows.forEach(function(tr){ tr.style.display=""; });
      t.textContent="收起 ▲"; t.setAttribute("data-exp","1");
    }
  }
});

document.getElementById("period").textContent=(GENERATED?GENERATED.slice(0,10):"")+" ｜ 共 "+RDATA.dates.length+" 个有效日期";
document.getElementById("note").innerHTML="口径说明：① 退货单=单据类型为「零售退货单」；销售单=单据类型为「零售单/预订转销售单」。<br>② 分子分母均剔除：内部业务为买断/礼品机出库、线上订单（单据来源=线上平台或线上订单标记√）。<br>③ 门店所属分公司标记「剔除」的整条剔除；<b>ASP/内购店</b>（业务组织以 ASP/AS 结尾或含「内购店」）整条剔除。<br>④ 退单率=退货单数÷销售单数（按单据编号去重计数），退货金额取实收金额绝对值。统计维度为单据日期。<br>⑤ 门店退单率按分公司分组展示，每分公司默认显示退单率最高的 TOP10 门店，点「更多」展开该分公司全部门店。";
renderOverview();
setWin("month");
</script>
</body></html>
