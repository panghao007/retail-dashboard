<script>
const ICON = {
  blue:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0071E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  green:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',
  purple:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#af52de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6 4.5 2.3 7.1-6.3-4.6L5.7 21l2.3-7.1-6-4.5h7.6z"/></svg>',
  red:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6a4 4 0 0 0 4 4h10a4 4 0 0 0 4-4V7"/><path d="M3 7l4-4M21 7l-4-4"/></svg>',
  teal:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5ac8fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'
};
/* 页面资源版本号：改 common.js / mobile.css / 各详情页后必须 bump——
   GitHub Pages 给 HTML 约 10 分钟缓存，不带版本号时用户会拿到旧页面（曾导致「渲染出错」）。 */
const PAGE_VER = '20260916e';
const PAGE = {member:'member-validity.html', cashier:'cashier.html', paid:'paid-member.html', return:'return-order.html', preorder:'preorder.html'};
const COLOR = {member:'blue', cashier:'green', paid:'purple', return:'red', preorder:'teal'};
function lastPeriod(periods){ const ks=Object.keys(periods||{}); return periods[ks[ks.length-1]]||null; }

/* ---------- 卡片数据构建（各自独立，某一项取数失败不影响其余） ---------- */
function cardMember(m){
  if(!m || !m.periods) return null;
  const mp=m.periods.month||lastPeriod(m.periods);
  // 分公司已按固定顺序展示，AI 解读需取「无效占比最高」者（不能再用 bl[0]）
  const bl=(m.branchList||[]).slice().sort((a,b)=>b.invalidRate-a.invalidRate);
  return {key:'member',title:'会员有效性',subtitle:'广度 · 会员质量',
    metrics:[{v:fmt(mp.total),l:'会员订单总数'},{v:mp.validRate+'%',l:'有效占比',c:'green'},{v:mp.invalidRate+'%',l:'无效占比',c:'red'}],
    progress:{pct:mp.validRate,left:'有效 '+fmt(mp.valid)+' 笔',right:'无效 '+fmt(mp.invalid)+' 笔'},
    insight: bl.length?(bl[0].name+' 无效占比'+bl[0].invalidRate+'% 居首，为当日合规风险最高分公司。'):'',
    action:'P0 · 对无效占比最高的分公司当日无效单逐单复盘，定位录入或资质环节问题并当日整改。'};
}
function cardCashier(c){
  if(!c || !c.periods) return null;
  const cp=c.periods.month||lastPeriod(c.periods);
  const bl=(cp.branchList||[]).slice().sort((a,b)=>b.noncompliant-a.noncompliant);
  return {key:'cashier',title:'合规收银',subtitle:'风险 · 收款规范',
    metrics:[{v:cp.compliantRate+'%',l:'合规率'},{v:fmt(cp.noncompliant),l:'不合规笔数',c:'red'},{v:fmt(cp.compliant),l:'有效收款笔数',c:'blue'}],
    progress:{pct:cp.compliantRate,left:'合规 '+fmt(cp.compliant)+' 笔',right:'不合规 '+fmt(cp.noncompliant)+' 笔'},
    insight: bl.length?(bl[0].name+' 不合规'+bl[0].noncompliant+'笔最多，需重点督导整改。'):'',
    action:'P0 · 财务重审收款通道白名单，运营将合规率纳入分公司考核。'};
}
function cardPaid(p){
  if(!p || !p.periods) return null;
  const pp=p.periods.month||lastPeriod(p.periods);
  const bl=(pp.branchList||[]).slice().sort((a,b)=>b.rate-a.rate);
  return {key:'paid',title:'付费会员',subtitle:'深度 · 高价值产值',
    metrics:[{v:pp.rate+'%',l:'整体连带率'},{v:'¥'+(pp.value/10000).toFixed(2)+'万',l:'总产值',c:'teal'},{v:fmt(pp.numerator),l:'VIP商品数',c:'purple'}],
    progress:{pct:pp.rate,left:'连带率 '+pp.rate+'%',right:''},
    insight: bl.length?(bl[0].name+' 连带率'+bl[0].rate+'% 最高，产值领先。'):'',
    action:'P1 · 对高价值占比低的门店，加强高客单套餐推荐与考核。'};
}
function cardReturn(r){
  if(!r || !r.periods) return null;
  const rp=r.periods.day||lastPeriod(r.periods);
  const bl=(rp.branchList||[]).slice().sort((a,b)=>b.rate-a.rate);
  return {key:'return',title:'零售退货',subtitle:'售后 · 退货风险',
    metrics:[{v:rp.rate+'%',l:'当日退货率',c:'red'},{v:fmt(rp.returnCount),l:'当日退货单',c:'red'},{v:fmt(rp.salesCount),l:'当日销售单',c:'blue'}],
    progress:{pct:Math.min(rp.rate*10,100),left:'较均值'+(rp.rate>3?'偏高':'正常'),right:''},
    insight: bl.length?(bl[0].name+' 退货率'+bl[0].rate+'% 最高，疑集中退单。'):'',
    action:'P0 · 退货率超8%门店售后48小时内回访，定位原因并反馈销售整改。'};
}
/* 预订单卡片已从首页移除（2026-09-16）：首页不再展示预订单磁贴；预订单仅通过右上角版本号「v2」隐蔽入口 → 输密码进入 preorder.html。密码门逻辑 openPreorderGate / poGate / poIndexUnlock 保留供 V2 入口使用。 */
function renderCard(c){
  const col=COLOR[c.key]||'blue';
  const metrics=(c.metrics||[]).map(m=>metric(m.v,m.l,m.c,m.delta)).join('');
  const act=c.locked?'onclick="openPreorderGate()"':`onclick="location.href='${PAGE[c.key]}'"`;
  const link=c.locked?'🔒 输入密码 ›':'进入看板 ›';
  const note=c.locked?insightBox('数据已加密','预订单含会员手机号与订金敏感数据，已加密存储。<span class="tag-red">点击卡片输入访问密码</span>后进入看板查看。'):'';
  return `<div class="card${c.locked?' locked':''}" ${act}>
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-${col}">${ICON[col]||''}</div>
      <div><div class="card-title">${esc(c.title)}</div><div class="card-subtitle">${esc(c.subtitle)}</div></div>
    </div><div class="card-link">${link}</div></div>
    <div class="metrics-row">${metrics}</div>
    ${progress(c.progress&&c.progress.pct||0, c.progress&&c.progress.left||'', c.progress&&c.progress.right||'')}
    ${c.insight?insightBox('AI 解读', esc(c.insight).replace(/([^\s]+)(?=居首|最高|最多|最低)/,'<span class="tag-red">$1</span>')):''}
    ${c.action?actionBox(esc(c.action)):''}
    ${note}
  </div>`;
}

/* ---------- 总览：并行取数 · 先到先渲染 · 单个失败不阻塞整页 ----------
   member   2 个小 JSON（约 300KB）
   cashier  单文件 379KB
   paid     只拉当月（约 11 天），不再拉全部 42 天
   return   只拉最近 1 天 26KB，不再拉 1.1MB 看板全文                       */
const DATE_BY_KEY={};  // 各看板数据日期：member=有效性(YYYY-MM-DD) 用于 xlsx；cashier=合规收银 T(YYYYMMDD) 用于 CSV
const SPECS=[
  {key:'member', run:()=>loadMember({light:true}), build:cardMember,  fresh:'../d/fresh.txt'},
  {key:'cashier',run:loadCashier,             build:cardCashier, fresh:'../cashier/fresh.txt'},
  {key:'paid',   run:()=>loadPaid(['month']), build:cardPaid,    fresh:'../paid_member/fresh.txt'},
  {key:'return', run:loadReturnLight,         build:cardReturn,  fresh:'../return_order/fresh.txt'}
];
async function bootIndex(){
  const el=document.getElementById('cards');
  const CARDS={}, DATES=[];
  let settled=0;
  function paint(){
    const objs=SPECS.map(s=>CARDS[s.key]).filter(Boolean);
    if(objs.length){
      el.innerHTML=objs.map(renderCard).join('');
      requestAnimationFrame(()=>{ document.querySelectorAll('.progress-fill').forEach(b=>{ const w=b.style.width; b.style.width='0'; setTimeout(()=>b.style.width=w,60); }); });
    }else if(settled>=SPECS.length){
      el.innerHTML='<div class="loading">暂无看板数据（待下次每日刷新后自动出现）</div>';
    }
    if(DATES.length) document.getElementById('hdrDate').innerHTML='<span class="dot"></span>实时数据 · '+esc(DATES.slice().sort().pop());
    const left=SPECS.length-settled;
    document.getElementById('genTime').textContent = left>0
      ? ('数据取自 PC 看板 · 剩余 '+left+' 个看板加载中…')
      : '数据实时取自 PC 看板（纯展示，未改任何管线）';
  }
  el.innerHTML='<div class="loading">数据加载中…</div>';
  document.getElementById('genTime').textContent='数据取自 PC 看板 · 共 '+SPECS.length+' 个看板加载中…';
  SPECS.forEach(s=>{
    Promise.resolve()
      .then(()=>s.run())
      .then(async d=>{
        const c=s.build(d);
        if(c){
          // 卡片标题下的灰色小字追加「数据更新时间」（管线推送前写入的 fresh.txt）
          const t=await loadFresh(s.fresh, d);
          if(t) c.subtitle=c.subtitle+' · 更新 '+t;
          CARDS[s.key]=c;
        }
        if(d&&d.latest_date){ DATES.push(d.latest_date); DATE_BY_KEY[s.key]=d.latest_date; }
        updateDownloads();
      })
      .catch(()=>{ /* 单个看板失败：跳过，其余照常渲染 */ })
      .then(()=>{ settled++; paint(); });
  });
}

/* ---------- 数据下载（与驾驶舱一致：有效性 xlsx + 合规收银不合规明细 CSV） ---------- */
let CASHIER_T=null;
function updateDownloads(){
  const vEl=document.getElementById('dl-validity');
  const cEl=document.getElementById('dl-cashier-csv');
  if(vEl){
    const vd=DATE_BY_KEY.member;
    if(vd){
      const fn=vd+'_会员有效性分析.xlsx';
      vEl.href='../d/'+encodeURIComponent(fn);
      vEl.setAttribute('download', fn);
      vEl.textContent='⬇ 会员有效性分析('+vd+').xlsx';
      vEl.classList.remove('disabled');
    } else { vEl.classList.add('disabled'); }
  }
  if(cEl){
    if(DATE_BY_KEY.cashier){
      CASHIER_T=DATE_BY_KEY.cashier;
      cEl.textContent='⬇ 合规收银不合规明细('+DATE_BY_KEY.cashier+').csv';
      cEl.classList.remove('disabled');
    } else { cEl.classList.add('disabled'); }
  }
}
function downloadCashierCSV(T){
  if(!T){ alert('合规收银数据加载中，请稍候再试'); return; }
  fetch('../cashier/daily/noncompliant_'+T+'.json?_='+Date.now()).then(function(r){return r.json();}).then(function(j){
    var rows=Array.isArray(j)?j:(j.noncompliant_rows||[]);
    if(!rows.length){ alert('当前无不合格明细'); return; }
    var cols=["单据日期","业务组织","所属分公司","销售门店","单据编号","支付通道","收款方式","收款类型","会员手机号","第三方订单号","判定"];
    var esc=function(s){ s=String(s==null?"":s); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
    var lines=[cols.join(",")];
    rows.forEach(function(r){ lines.push(cols.map(function(c){return esc(r[c]);}).join(",")); });
    var blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="不合规明细_"+T+".csv"; a.click();
  }).catch(function(){ alert('明细加载失败'); });
}
document.getElementById('dl-cashier-csv').addEventListener('click', function(){ downloadCashierCSV(CASHIER_T); });

/* ---------- 预订单密码门：点击加密卡片 → 弹框输密码 → 解密并进入看板 ----------
   成功解密后把包写入 sessionStorage，跳转 preorder.html 时免二次输入。 */
function openPreorderGate(){
  const g=document.getElementById('poGate'); if(!g) return;
  const e=document.getElementById('poGateErr'); if(e){ e.style.display='none'; e.textContent=''; }
  const btn=document.getElementById('poGateBtn'); if(btn){ btn.disabled=false; btn.textContent='解 锁'; }
  g.style.display='flex';
  const inp=document.getElementById('poGateInput'); if(inp){ inp.value=''; inp.focus(); }
}
function poGateClose(){ const g=document.getElementById('poGate'); if(g) g.style.display='none'; }
function poGateErr(msg){ const e=document.getElementById('poGateErr'); if(e){ e.textContent=msg; e.style.display='block'; } }
async function poIndexUnlock(){
  const inp=document.getElementById('poGateInput');
  const pw=inp?inp.value:'';
  if(!pw){ poGateErr('请输入密码'); return; }
  poGateErr('');
  const btn=document.getElementById('poGateBtn');
  if(btn){ btn.disabled=true; btn.textContent='解密中…'; }
  try{
    await poUnlockWith(pw);
    // 带版本号跳转：GitHub Pages 给 HTML 设了约 10 分钟缓存，不带版本号会拿到旧页面（曾导致渲染出错）
    location.href='preorder.html?v='+PAGE_VER;
  }catch(e){
    poGateErr((e && e.message==='BROWSER_TOO_OLD') ? '浏览器版本过低，请升级系统/浏览器后再试' : '密码错误或数据损坏，请重试');
    if(btn){ btn.disabled=false; btn.textContent='解 锁'; }
  }
}
(function bindGateEnter(){
  const inp=document.getElementById('poGateInput');
  if(inp) inp.addEventListener('keydown', ev=>{ if(ev.key==='Enter') poIndexUnlock(); });
})();

bootIndex();
</script>
