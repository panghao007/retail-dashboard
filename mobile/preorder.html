<script>
function maskPhone(p){
  p=String(p||'');
  if(/^\d{11}$/.test(p)) return p.slice(0,3)+'***'+p.slice(-5);
  return p;
}
function ageDays(fd, asof){
  try{
    const d=new Date(+fd.slice(0,4),+fd.slice(4,6)-1,+fd.slice(6,8));
    const a=new Date(+asof.slice(0,4),+asof.slice(4,6)-1,+asof.slice(6,8));
    return Math.floor((a-d)/86400000);
  }catch(e){ return 0; }
}
function wan(v){ return '¥'+(Math.abs(v)/10000).toFixed(2)+'万'; }
/* 沉淀时长分档定义：gtN = 最早订金日距今 > N 天（累计）；le7 = ≤7 天（刚充值未满一周） */
const BUCKET_DEFS=[
  {k:'gt90', label:'90天以上', test:a=>a>90, tip:'越久未核销风险越高（>90天深度沉淀）'},
  {k:'gt60', label:'60天以上', test:a=>a>60, tip:'越久未核销风险越高（>60天标红）'},
  {k:'gt30', label:'30天以上', test:a=>a>30, tip:'越久未核销风险越高（>60天标红）'},
  {k:'gt14', label:'14天以上', test:a=>a>14, tip:'越久未核销风险越高（>60天标红）'},
  {k:'gt7',  label:'7天以上',  test:a=>a>7,  tip:'越久未核销风险越高（>60天标红）'},
  {k:'le7',  label:'7天内',    test:a=>a<=7, tip:'刚充值未满一周，尚未构成沉淀风险'},
];
let _PB=null;      // 沉淀快照（BUILD 时填充）：{as_of, phones[], branches[]}
let _bk='gt90';    // 当前选中的时长分档
let _br='';        // 当前选中的分公司（'' = 全部）
let _PD=null;      // 维度风险洞察快照（BUILD 时填充）：{store,seller,phone}
let _dim='store';  // 当前维度：store 门店 / seller 销售员 / phone 号码
let _drisk='';     // 当前异常筛选：'' = 全部，否则 freq/aged/lowConv/highRefund
window.BUILD = function(period, dash, active){
  const periodName=PERIOD_LABEL[active]||'';
  const ds=period.dates||[];
  const dayN=period.days||ds.length;
  const de=document.getElementById('hdrDate');
  if(de){
    let rng=String(dash.latest_date||'');
    if(ds.length){
      const f=ds[0], l=ds[ds.length-1];
      const head=(active==='all'||ds.length>31)?(f.slice(0,4)+'-'+f.slice(4,6)+'-'+f.slice(6,8)):(f.slice(4,6)+'-'+f.slice(6,8));
      rng=periodName+' '+head+' ~ '+l.slice(4,6)+'-'+l.slice(6,8)+' 共'+dayN+'天';
    }
    de.innerHTML='<span class="dot"></span>'+esc(rng);
  }
  const freqEl=document.getElementById('freqTh'); if(freqEl) freqEl.textContent=(period.freq||3);
  const freq=(period.freq||3);
  const maxC=Math.max(1,...(period.branchList||[]).map(b=>b.count));
  const branchHtml=(period.branchList||[]).map((b,i)=>branchItem(i,b.name,fmt(b.count)+'单','c-blue',b.count/maxC*100,'#0071E3')).join('');
  const branchDist=(period.branchList||[]).map(b=>`<div class="detail-item"><div class="detail-item-name">${esc(b.name)}</div><div class="detail-item-value c-gray">${fmt(b.count)}单 · 净未消费${wan(b.amount)}</div></div>`).join('');
  // 手机号维度：频繁(风险)置顶红标，其后列 TOP20 正常号（手机号脱敏展示）
  const allPh=period.phoneList||[];
  const riskAll=allPh.filter(p=>p.risk);
  const riskPhones=riskAll.slice(0,60);
  const normalPhones=allPh.filter(p=>!p.risk).slice(0,20);
  const showPhones=riskPhones.concat(normalPhones);
  const phoneHtml=showPhones.map(p=>{
    const hc=p.risk?' style="background:rgba(255,59,48,0.05);border:1px solid rgba(255,59,48,0.18)"':'';
    const badge=p.risk?' <span class="badge badge-red">风险</span>':'';
    return `<div class="store-item tappable"${hc} onclick="openPhoneDrawer('${p.phone}')"><div class="store-info"><div class="store-name">${esc(maskPhone(p.phone))}${badge}</div>`
      +`<div class="store-meta">${fmt(p.count)}次预订 · 涉及${p.stores.length}家门店 · 净未消费${wan(p.amount)} <span class="store-tap-hint">· 查看明细›</span></div></div>`
      +`<div class="store-value"><div class="store-value-num ${p.risk?'c-red':''}">${p.risk?'⚠ 频繁':'正常'}</div>`
      +`<div class="store-value-label">${fmt(p.count)}次</div></div></div>`;
  }).join('');
  const phoneNote=(riskAll.length>riskPhones.length)
    ? `<div class="insight-text" style="font-size:11px;color:#86868b;margin-top:6px">风险号共 ${fmt(riskAll.length)} 个，此处展示前 ${riskPhones.length} 个（按预订次数降序）。</div>` : '';
  const topC=(period.branchList||[]).slice().sort((a,b)=>b.count-a.count)[0];
  const riskInfo = period.riskCount>0
    ? `<span class="tag-red">${period.riskCount}</span> 个手机号周期内预订 ≥${freq} 次，疑似虚假预订/收款不过账，类储值风险，需逐单核查。`
    : '当前周期内无频繁预订手机号（均 < '+freq+' 次），预订行为正常。';

  /* ---------- 会员充值未核销（沉淀）：可先按「全部/6分公司」筛选，再按最早订金日分档（列表懒渲染） ---------- */
  const ru=dash.rechargeUnused||null;
  let rechargeHtml='';
  if(ru){
    const brs=sortBranch((ru.branchList||[]).map(b=>({name:b}))).map(x=>x.name);
    _PB={ as_of: ru.as_of||'', phones:(ru.phones||[]).slice().sort((a,b)=>b.amount-a.amount), branches:brs };
    if(_br && brs.indexOf(_br)<0) _br='';   // 快照里不存在该分公司 → 回落「全部」
    const brChips=[''].concat(brs).map(b=>
      `<div class="br-chip${_br===b?' active':''}" data-br="${esc(b)}" onclick="selectBranch('${esc(b)}')">${esc(b||'全部')}</div>`
    ).join('');
    const chips=BUCKET_DEFS.map(b=>
      `<div class="bucket-chip${b.k===_bk?' active':''}" data-bk="${b.k}" onclick="selectBucket('${b.k}')">${b.label}</div>`
    ).join('');
    rechargeHtml = `
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-red"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v4H3zM3 10h18v11H3zM7 14h2M11 14h2M15 14h2"/></svg></div>
      <div><div class="card-title">会员充值未核销（沉淀）</div><div class="card-subtitle">截至 ${esc(ru.as_of||'')} · 净未消费订金(实收−已核销−已退)&gt;0</div></div>
    </div></div>
    <div class="br-row">${brChips}</div>
    <div class="insight-text" id="ruSum" style="font-size:12px;margin:0 0 10px;color:#1d1d1f;line-height:1.6">${ruSumHtml(_br)}</div>
    <div class="bucket-row">${chips}</div>
    <div id="bucketBody"></div>
    ${actionBox('P0 · 充值未核销逐单核查：核对订金是否真实到账、是否对应真实意向商品；&gt;30天未核销的须联系客户履约或清退，发现资金异常立即上报。')}
  </div>`;
  }

  /* ---------- 维度风险洞察：门店 / 销售员 / 号码（内容由 renderDim() 在插入 DOM 后填充） ---------- */
  const dims=period.dims||null;
  let dimHtml='';
  if(dims){
    _PD=dims;
    if(!dims[_dim]) _dim='store';
    dimHtml=`
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-purple"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#af52de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg></div>
      <div><div class="card-title">维度风险洞察</div><div class="card-subtitle">门店 · 销售员 · 号码 · 金额口径 · ${esc(periodName)}</div></div>
    </div></div>
    <div class="dim-row" id="dimChips"></div>
    <div class="risk-row" id="dimRiskChips"></div>
    <div class="dim-sum" id="dimSum"></div>
    <div id="dimBody"></div>
  </div>`;
  }

  return `
  <div class="card">
    <div class="card-head"><div class="card-head-left">

            + `<div class="detail-item-value c-gray">${fmt(x.count)}单 · 净未消费${wan(x.amount)}</div></div>`;

/* ---------- 预订单加密门：输密码本地解密后渲染 ----------
   解密/缓存（poUnlockWith / poAutoUnlock / poCachedPass）定义在 common.js，与首页共用。 */
function poShowErr(msg){ const e=document.getElementById('poGateErr'); if(e){ e.textContent=msg; e.style.display='block'; } }
function poHideGate(){ const g=document.getElementById('poGate'); if(g) g.style.display='none'; }
async function poUnlock(){
  const inp=document.getElementById('poGateInput');
  const pw=inp?inp.value:'';
  if(!pw){ poShowErr('请输入密码'); return; }
  poShowErr('');
  const btn=document.getElementById('poGateBtn');
  if(btn){ btn.disabled=true; btn.textContent='解密中…'; }
  try{
    await poUnlockWith(pw);
    poHideGate();
    boot(loadPreorder,'month');
  }catch(e){
    poShowErr((e && e.message==='BROWSER_TOO_OLD') ? '浏览器版本过低，请升级系统/浏览器后再试'
      : (e && e.message==='TIMEOUT') ? '网络加载超时，请检查网络后点「解锁」重试'
      : '密码错误或数据损坏，请重试');
    if(btn){ btn.disabled=false; btn.textContent='解 锁'; }
  }
}
/* V2 密码控制已关闭（2026-09-20）：启动即用内置默认密码静默解密，不弹密码框。
   仅在自动解密失败（浏览器过旧/网络超时）时，才退化显示手动密码输入。 */
function poShowLoading(msg){
  const g=document.getElementById('poGate'); if(g) g.style.display='flex';
  const ti=document.getElementById('poGateTitle'), su=document.getElementById('poGateSub');
  const lo=document.getElementById('poGateLoading'), fm=document.getElementById('poGateForm');
  if(ti) ti.textContent='预订单数据';
  if(su) su.textContent=msg||'正在加载数据…';
  if(lo) lo.style.display='block';
  if(fm) fm.style.display='none';
}
function poShowGateFallback(e){
  const ic=document.getElementById('poGateIcon'), ti=document.getElementById('poGateTitle'), su=document.getElementById('poGateSub');
  const lo=document.getElementById('poGateLoading'), fm=document.getElementById('poGateForm'), inp=document.getElementById('poGateInput');
  if(ic) ic.textContent='🔒';
  if(ti) ti.textContent='预订单数据已加密';
  if(su) su.textContent='请输入访问密码后查看';
  if(lo) lo.style.display='none';
  if(fm) fm.style.display='block';
  poShowErr((e && e.message==='BROWSER_TOO_OLD') ? '浏览器版本过低，请升级系统/浏览器后再试' : '自动加载失败，请手动输入密码');
  if(inp){ inp.value=''; inp.focus(); inp.addEventListener('keydown', ev=>{ if(ev.key==='Enter') poUnlock(); }); }
}
async function poInitGate(){
  if(window.__PO){ boot(loadPreorder,'month'); return; }
  if(await poAutoUnlock()){ boot(loadPreorder,'month'); return; }
  poShowLoading('数据加载中…');
  try{
    await poUnlockDefault();
    poHideGate();
    boot(loadPreorder,'month');
  }catch(e){ poShowGateFallback(e); }
}
poInitGate();

<script>

/* ---------- 维度风险洞察：门店 / 销售员 / 号码 ----------

const DIM_RISK_LABEL={freq:'频繁预订',aged:'长期未转销未退',lowConv:'转效率偏低',highRefund:'退订率偏高'};

    showDrawer(DIM_LABEL[_dim]+' · 全部',
      (_drisk?DIM_RISK_LABEL[_drisk]+' · ':'')+fmt(list.length)+' '+DIM_UNIT[_dim]+'（风险优先）',
      (list.length?`<div>${list.map((r,k)=>dimRowHtml(r,k)).join('')}</div>`:'<div class="drawer-empty">暂无数据</div>')+note);
    return;
  }
  const r=list[i];
  const nm=(_dim==='phone')?maskPhone(r.name):r.name;
  showDrawer(nm, DIM_LABEL[_dim]+(r.branch?(' · '+r.branch):'')+(r.onlyAged?' · 本周期无单':'')+(r.stores&&r.stores.length?(' · 涉及 '+r.stores.length+' 家门店'):''),
    `<div class="drawer-sum">
       <div class="cell"><b>${fmt(r.count)}</b><span>单量</span></div>
       <div class="cell"><b>${wan(r.recv)}</b><span>实收</span></div>
       <div class="cell"><b>${wan(r.verified)}</b><span>已转销</span></div>
       <div class="cell"><b>${wan(r.refund)}</b><span>已退</span></div>
       <div class="cell"><b style="color:#0071E3">${wan(r.net)}</b><span>净未消费</span></div>
     </div>
     <div class="drawer-sum">
       <div class="cell"><b>${r.recv>0?dimPct(r.conv):'—'}</b><span>转效率</span></div>
       <div class="cell"><b>${r.recv>0?dimPct(r.refundRate):'—'}</b><span>退订率</span></div>
       <div class="cell"><b style="color:#af52de">${wan(r.aged)}</b><span>长期未转销未退</span></div>
       <div class="cell"><b>${fmt(r.agedCnt)}</b><span>长期笔数</span></div>
     </div>`
    +((r.risk||[]).length?`<div class="dim-item-risk" style="margin-top:10px">${r.risk.map(k=>`<span class="risk-tag ${k}">${DIM_RISK_LABEL[k]}</span>`).join('')}</div>`:'')
    +(r.stores&&r.stores.length?`<div class="drawer-note">涉及门店（${r.stores.length} 家）：${r.stores.slice(0,12).map(esc).join('、')}${r.stores.length>12?' 等':''}</div>`:'')
    +note);
}
/* BUILD 返回字符串、DOM 插入后才可操作 → 用 AFTER_BUILD 钩子渲染当前档列表 */
window.AFTER_BUILD=function(){ if(_PB) renderBucketList(_bk); renderDim(); };
let _poCache=null, _poLoading=null;
async function loadPhoneOrders(){
  if(_poCache) return _poCache;
  if(_poLoading) return _poLoading;
  _poLoading=(async()=>{ try{ _poCache=poFile('phone_orders.json')||{}; }catch(e){ _poCache={}; } return _poCache; })();
  return _poLoading;
}
let _dwBack=null;   // 抽屉返回回调（从「全部」抽屉下钻逐笔明细时，可返回上一层档位列表）
function showDrawer(title, sub, bodyHtml){
  document.getElementById('dwTitle').textContent=title;
  document.getElementById('dwSub').textContent=sub;
  document.getElementById('dwBody').innerHTML=bodyHtml;
  document.getElementById('drawerMask').classList.add('open');
  document.getElementById('phoneDrawer').classList.add('open');
}
function backRow(){ return _dwBack?'<div class="drawer-back" onclick="_dwBack&&_dwBack()">‹ 返回全部</div>':''; }
function openPhoneDrawer(phone, fromBucket){
  const raw=String(phone||'');
  _dwBack=fromBucket?function(){openBucketDrawer(fromBucket);}:null;
  showDrawer(maskPhone(raw),'逐笔预订单明细（点遮罩 / ✕ 关闭）','<div class="drawer-loading">加载明细中…</div>');
  loadPhoneOrders().then(data=>renderPhoneOrders(raw,data[raw]||[]));
}
function closePhoneDrawer(){
  document.getElementById('drawerMask').classList.remove('open');
  document.getElementById('phoneDrawer').classList.remove('open');
}
function renderPhoneOrders(phone, arr){
  const body=document.getElementById('dwBody');
  if(!arr.length){ body.innerHTML=backRow()+'<div class="drawer-empty">该手机号在导出中无有效预订单明细</div>'; return; }
  let R=0,V=0,F=0;
  const rows=arr.map(o=>{
    const r=Number(o.r)||0, v=Number(o.v)||0, f=Number(o.f)||0, net=r-v-f;
    R+=r; V+=v; F+=f;
    const ds=String(o.d||'').replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3');
    return `<tr><td>${ds}</td><td class="store" title="${esc(o.s)}">${esc(o.s)}</td>`
      +`<td>${money(r)}</td><td>${money(v)}</td><td>${money(f)}</td>`
      +`<td class="net${net>0?'':' zero'}">${money(net)}</td></tr>`;
  }).join('');
  const net=R-V-F;
  body.innerHTML=backRow()+`
    <div class="drawer-sum">
      <div class="cell"><b>${fmt(arr.length)}</b><span>笔数</span></div>
      <div class="cell"><b>${money(R)}</b><span>实收</span></div>
      <div class="cell"><b>${money(V)}</b><span>已核销</span></div>
      <div class="cell"><b>${money(F)}</b><span>已退</span></div>
      <div class="cell"><b style="color:#0071E3">${money(net)}</b><span>净未消费</span></div>
    </div>
    <table class="olist"><thead><tr><th>日期</th><th class="store">门店</th><th>实收</th><th>核销</th><th>退</th><th>净额</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="drawer-note">净未消费 = 实收 − 已核销(已转销) − 已退，逐笔口径已按单据编号去重。金额单位：元。</div>`;
}
</script>
