<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="MrSl1EtBFahqJNNv3Az4rZ">
<head data-page-node-id="TTi3OxN4FdCzRTyLOmdBjU">
<meta charset="UTF-8" data-page-node-id="L2IEXGZKHpksXIDAEtG4el">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" data-page-node-id="fe2D5foLSMaYAvwNReJGW5">
<title>预订单 · 移动端</title>

<body data-page-node-id="sljD1WMsfKzlbJmGkBXitz">
<div class="header" data-page-node-id="j1a2tL4mJW4KmH31LgdqPM">
  <div class="header-top" data-page-node-id="QK9FZNMj09zdizPy2FE08j">
    <div class="header-back" onclick="location.href='index.html'" data-page-node-id="88qnA3yMJVifGScZmz7ZeU">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" data-page-node-id="MqLoISgsgV96zHzA3sqVu1"><path d="M10 3L5 8l5 5" data-page-node-id="lA0r3JtNxqbJwEUFCBibqr"/></svg>返回
    </div>
    <div class="header-badge" data-page-node-id="GsKTxP5RF5UuHYIiUGLkK1">v1.1</div>
  </div>
  <div class="header-title" data-page-node-id="SgvyaakE0Muv9qubGOk1rm">预订单</div>
  <div class="header-date" id="hdrDate" data-page-node-id="DY7nSZwvE6MTfATVLdZ46F"><span class="dot" data-page-node-id="vdVnZcdqFXbtMhyuDL4vPL"></span></div>
  <div class="tab-row" id="tabRow" data-page-node-id="f7BbQHy2WkMqgEUL8n6cJd"></div>
</div>
<div class="cards" id="cards" data-page-node-id="DBxbPAo9aQ1bKPwD5TK6gS"></div>
<div class="footer" data-page-node-id="JF34WenecNNJO2mboPrLZl">
  来源：ERP 预订单查询-导出数据（按列表）· 已剔除 ASP/内购店<br data-page-node-id="Sab5hl3G0H1hJsSx450YEd">
  频繁预订 = 同手机号周期内预订 ≥ <span id="freqTh" data-page-node-id="ODlumHBGcFQqCpdA0oNMEg">3</span> 次（疑似虚假预订/收款不过账，类储值风险）<br data-page-node-id="vWygE8h1YirYYABD2QlU4S">
  净未消费金额 = 实收金额 − 已核销(已转销)金额 − 已退金额；会员手机号脱敏展示（前三后五，中间3位***）<br data-page-node-id="hxITkynZbHxbPEzNyB7976">
  <span id="genTime" data-page-node-id="drj0mkdXqBOgsnNdUdFneY"></span><br data-page-node-id="hxITkynZbHxbPEzNyB7976">
  <a class="footer-link" href="index.html" data-page-node-id="hZ3TjdIjJCZ5i3teLQ8emE">返回看板总览 ›</a>
</div>
<script src="common.js"></script>
<script>
function maskPhone(p){
  p=String(p||'');
  if(/^\d{11}$/.test(p)) return p.slice(0,3)+'***'+p.slice(-5);
  return p;
}
function ageDays(fd, asof){
  try{
    const d=new Date(+fd.slice(0,4),+fd.slice(4,6)-1,+fd.slice(6,8));
    const a=new Date(+asof.slice(0,4),+asof.slice(4,6)-1,+asof.slice(6,8));
    return Math.floor((a-d)/86400000);
  }catch(e){ return 0; }
}
function wan(v){ return '¥'+(Math.abs(v)/10000).toFixed(2)+'万'; }
window.BUILD = function(period, dash, active){
  const de=document.getElementById('hdrDate');
  if(de){ const ds=period.dates||[]; de.innerHTML='<span class="dot"></span>'+(ds.length?('当月 '+ds[0].slice(4,6)+'-'+ds[0].slice(6,8)+' ~ '+ds[ds.length-1].slice(4,6)+'-'+ds[ds.length-1].slice(6,8)+' 共'+ds.length+'天'):(dash.latest_date||'')); }
  const freqEl=document.getElementById('freqTh'); if(freqEl) freqEl.textContent=(period.freq||3);
  const freq=(period.freq||3);
  const maxC=Math.max(1,...(period.branchList||[]).map(b=>b.count));
  const branchHtml=(period.branchList||[]).map((b,i)=>branchItem(i,b.name,fmt(b.count)+'单','c-blue',b.count/maxC*100,'#0071E3')).join('');
  const branchDist=(period.branchList||[]).map(b=>`<div class="detail-item"><div class="detail-item-name">${esc(b.name)}</div><div class="detail-item-value c-gray">${fmt(b.count)}单 · 净未消费${wan(b.amount)}</div></div>`).join('');
  const storeHtml=(period.storeTop10||[]).map(s=>storeItem(s.name,(s.company||'')+(s.company?' · ':'')+fmt(s.count)+'单 · 净未消费'+wan(s.amount),fmt(s.count),'预订单数','c-blue',false)).join('');
  // 手机号维度：频繁(风险)置顶红标，其后列 TOP20 正常号（手机号脱敏展示）
  const riskPhones=(period.phoneList||[]).filter(p=>p.risk);
  const normalPhones=(period.phoneList||[]).filter(p=>!p.risk).slice(0,20);
  const showPhones=riskPhones.concat(normalPhones);
  const phoneHtml=showPhones.map(p=>{
    const hc=p.risk?' style="background:rgba(255,59,48,0.05);border:1px solid rgba(255,59,48,0.18)"':'';
    const badge=p.risk?' <span class="badge badge-red">风险</span>':'';
    return `<div class="store-item"${hc}><div class="store-info"><div class="store-name">${esc(maskPhone(p.phone))}${badge}</div>`
      +`<div class="store-meta">${fmt(p.count)}次预订 · 涉及${p.stores.length}家门店 · 净未消费${wan(p.amount)}</div></div>`
      +`<div class="store-value"><div class="store-value-num ${p.risk?'c-red':''}">${p.risk?'⚠ 频繁':'正常'}</div>`
      +`<div class="store-value-label">${fmt(p.count)}次</div></div></div>`;
  }).join('');
  const topC=(period.branchList||[]).slice().sort((a,b)=>b.count-a.count)[0];
  const periodName=PERIOD_LABEL[active]||'';
  const riskInfo = period.riskCount>0
    ? `<span class="tag-red">${period.riskCount}</span> 个手机号周期内预订 ≥${freq} 次，疑似虚假预订/收款不过账，类储值风险，需逐单核查。`
    : '当前周期内无频繁预订手机号（均 < '+freq+' 次），预订行为正常。';
  // 充值未核销（沉淀）快照
  const ru=dash.rechargeUnused||null;
  let rechargeHtml='';
  if(ru){
    const B=ru.buckets||{};
    const bk=(k,label,color)=>{ const o=B[k]||{phones:0,amount:0}; return metric(fmt(o.phones), label+' · '+wan(o.amount), color); };
    const phones=(ru.phones||[]).slice(0,60).map(p=>{
      const age=ageDays(p.first_date, ru.as_of||'');
      const hot=age>60;
      const meta='最早订金 '+p.first_date+' · '+p.stores.length+'家店 · '+p.count+'笔 · 沉淀'+age+'天';
      return `<div class="store-item"${hot?' style="background:rgba(255,59,48,0.05);border:1px solid rgba(255,59,48,0.15)"':''}>`
        +`<div class="store-info"><div class="store-name">${esc(maskPhone(p.phone))}${hot?' <span class="badge badge-red">超60天</span>':''}</div>`
        +`<div class="store-meta">${esc(meta)}</div></div>`
        +`<div class="store-value"><div class="store-value-num ${hot?'c-red':''}">${wan(p.amount)}</div>`
        +`<div class="store-value-label">净未消费</div></div></div>`;
    }).join('');
    rechargeHtml = `
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-red"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v4H3zM3 10h18v11H3zM7 14h2M11 14h2M15 14h2"/></svg></div>
      <div><div class="card-title">会员充值未核销（沉淀）</div><div class="card-subtitle">截至 ${esc(ru.as_of||'')} · 净未消费订金(实收−已核销−已退)&gt;0</div></div>
    </div></div>
    <div class="metrics-row">
      ${bk('gt7','>7天','c-teal')}
      ${bk('gt14','>14天','c-blue')}
      ${bk('gt30','>30天','c-orange')}
      ${bk('gt60','>60天','c-red')}
    </div>
    <div class="insight-text" style="font-size:12px;margin:2px 0 10px;color:#1d1d1f;line-height:1.6">
      共 <span class="tag-red">${fmt(ru.total_phones||0)}</span> 个手机号、沉淀 <b>${wan(ru.total_amount||0)}</b> 订金长期未核销/未退；
      四档为<b>累计口径</b>（&gt;60天含更久）。收款不过账或挪作他用即构成储值类资金风险，须逐单核查。
    </div>
    <div class="store-list">${phones}</div>
    ${(ru.phones||[]).length>60?`<div class="insight-text" style="font-size:11px;color:#86868b;margin-top:6px">仅展示金额 TOP60，全量 ${fmt(ru.phones.length)} 个详见导出数据。</div>`:''}
    ${actionBox('P0 · 充值未核销逐单核查：核对订金是否真实到账、是否对应真实意向商品；&gt;30天未核销的须联系客户履约或清退，发现资金异常立即上报。')}
  </div>`;
  }
  return `
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-teal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5ac8fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>
      <div><div class="card-title">核心指标</div><div class="card-subtitle">预售 · 频繁预订风险 · ${esc(periodName)}</div></div>
    </div></div>
    <div class="metrics-row">
      ${metric(fmt(period.count),'预订单数','c-blue')}
      ${metric(wan(period.recv),'实收金额','c-teal')}
      ${metric(wan(period.amount),'净未消费','c-blue')}
      ${metric(fmt(period.riskCount),'频繁手机号','c-red')}
    </div>
    <div class="insight-text" style="font-size:12px;margin:2px 0 8px;color:#1d1d1f;line-height:1.6">
      实收 ${wan(period.recv)} · 已核销 ${wan(period.verified)} · 已退 ${wan(period.refund)} → 净未消费 <b>${wan(period.amount)}</b>
    </div>
    <div class="metrics-row">
      ${metric(fmt(period.storeCount),'涉及门店数','c-teal')}
      ${metric(String((period.dates||[]).length),'统计天数','c-gray')}
      ${metric(wan(period.verified),'已核销金额','c-gray')}
      ${metric(wan(period.refund),'已退金额','c-gray')}
    </div>
    ${progress(Math.min(period.riskCount*8,100),'频繁手机号 '+fmt(period.riskCount)+' 个','预订单 '+fmt(period.count)+' 笔')}
    ${insightBox('风险口径','同手机号在「'+esc(periodName)+'」内预订 ≥'+freq+' 次即标红「风险」：疑似员工/渠道刷单、虚假预订或收款不过账，性质类似违规储值，须逐单核查收款与履约。')}
  </div>
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-blue"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0071E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M3 7v14M21 7v14M3 7l9-4 9 4M9 21v-6h6v6"/></svg></div>
      <div><div class="card-title">分公司预订单</div><div class="card-subtitle">${esc(periodName)}</div></div>
    </div></div>
    <div class="detail-list">${branchHtml}</div>
    <div class="detail-section">
      <div class="detail-title">分公司净未消费金额</div>
      <div class="detail-list">${branchDist}</div>
    </div>
    ${topC?insightBox('AI 解读','<span class="tag-blue">'+esc(topC.name)+'</span> 预订单'+fmt(topC.count)+'笔居首，贡献最高。'):''}
  </div>
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-orange"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff9500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M3 7v14M21 7v14M3 7l9-4 9 4M9 21v-6h6v6"/></svg></div>
      <div><div class="card-title">门店预订单 TOP 10</div><div class="card-subtitle">按预订单数排序 · ${esc(periodName)}</div></div>
    </div></div>
    <div class="store-list">${storeHtml}</div>
  </div>
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-red"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6 4.5 2.3 7.1-6.3-4.6L5.7 21l2.3-7.1-6-4.5h7.6z"/></svg></div>
      <div><div class="card-title">会员手机号 · 频繁预订</div><div class="card-subtitle">风险置顶 · ${esc(periodName)}</div></div>
    </div></div>
    <div class="insight-text" style="font-size:12px;margin:2px 0 10px;color:#1d1d1f;line-height:1.6">${riskInfo}</div>
    <div class="store-list">${phoneHtml}</div>
    ${actionBox('P0 · 频繁预订手机号逐单核查：确认是否真实收款、是否履约发货；发现收款不过账或无履约立即冻结并上报，参照储值违规处置。')}
  </div>
  ${rechargeHtml}`;
};
boot(loadPreorder,'month');
</script>
</body>
