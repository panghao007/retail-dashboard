.drawer-loading{text-align:center;color:#86868b;padding:44px 0;font-size:13px}

<script>
function maskPhone(p){
  p=String(p||'');
  if(/^\d{11}$/.test(p)) return p.slice(0,3)+'***'+p.slice(-5);
  return p;
}
function ageDays(fd, asof){
  try{
    const d=new Date(+fd.slice(0,4),+fd.slice(4,6)-1,+fd.slice(6,8));
    const a=new Date(+asof.slice(0,4),+asof.slice(4,6)-1,+asof.slice(6,8));
    return Math.floor((a-d)/86400000);
  }catch(e){ return 0; }
}
function wan(v){ return '¥'+(Math.abs(v)/10000).toFixed(2)+'万'; }
/* 沉淀时长分档定义：gtN = 最早订金日距今 > N 天（累计）；le7 = ≤7 天（刚充值未满一周） */
const BUCKET_DEFS=[
  {k:'gt90', label:'90天以上', test:a=>a>90, tip:'越久未核销风险越高（>90天深度沉淀）'},
  {k:'gt60', label:'60天以上', test:a=>a>60, tip:'越久未核销风险越高（>60天标红）'},
  {k:'gt30', label:'30天以上', test:a=>a>30, tip:'越久未核销风险越高（>60天标红）'},
  {k:'gt14', label:'14天以上', test:a=>a>14, tip:'越久未核销风险越高（>60天标红）'},
  {k:'gt7',  label:'7天以上',  test:a=>a>7,  tip:'越久未核销风险越高（>60天标红）'},
  {k:'le7',  label:'7天内',    test:a=>a<=7, tip:'刚充值未满一周，尚未构成沉淀风险'},
];
let _PB=null;      // 沉淀快照（BUILD 时填充）：{as_of, phones[]}
let _bk='gt90';    // 当前选中的分档
window.BUILD = function(period, dash, active){
  const periodName=PERIOD_LABEL[active]||'';
  const ds=period.dates||[];
  const dayN=period.days||ds.length;
  const de=document.getElementById('hdrDate');
  if(de){
    let rng=String(dash.latest_date||'');
    if(ds.length){
      const f=ds[0], l=ds[ds.length-1];
      const head=(active==='all'||ds.length>31)?(f.slice(0,4)+'-'+f.slice(4,6)+'-'+f.slice(6,8)):(f.slice(4,6)+'-'+f.slice(6,8));
      rng=periodName+' '+head+' ~ '+l.slice(4,6)+'-'+l.slice(6,8)+' 共'+dayN+'天';
    }
    de.innerHTML='<span class="dot"></span>'+esc(rng);
  }
  const freqEl=document.getElementById('freqTh'); if(freqEl) freqEl.textContent=(period.freq||3);
  const freq=(period.freq||3);
  const maxC=Math.max(1,...(period.branchList||[]).map(b=>b.count));
  const branchHtml=(period.branchList||[]).map((b,i)=>branchItem(i,b.name,fmt(b.count)+'单','c-blue',b.count/maxC*100,'#0071E3')).join('');
  const branchDist=(period.branchList||[]).map(b=>`<div class="detail-item"><div class="detail-item-name">${esc(b.name)}</div><div class="detail-item-value c-gray">${fmt(b.count)}单 · 净未消费${wan(b.amount)}</div></div>`).join('');
  // 手机号维度：频繁(风险)置顶红标，其后列 TOP20 正常号（手机号脱敏展示）
  const allPh=period.phoneList||[];
  const riskAll=allPh.filter(p=>p.risk);
  const riskPhones=riskAll.slice(0,60);
  const normalPhones=allPh.filter(p=>!p.risk).slice(0,20);
  const showPhones=riskPhones.concat(normalPhones);
  const phoneHtml=showPhones.map(p=>{
    const hc=p.risk?' style="background:rgba(255,59,48,0.05);border:1px solid rgba(255,59,48,0.18)"':'';
    const badge=p.risk?' <span class="badge badge-red">风险</span>':'';
    return `<div class="store-item tappable"${hc} onclick="openPhoneDrawer('${p.phone}')"><div class="store-info"><div class="store-name">${esc(maskPhone(p.phone))}${badge}</div>`
      +`<div class="store-meta">${fmt(p.count)}次预订 · 涉及${p.stores.length}家门店 · 净未消费${wan(p.amount)} <span class="store-tap-hint">· 查看明细›</span></div></div>`
      +`<div class="store-value"><div class="store-value-num ${p.risk?'c-red':''}">${p.risk?'⚠ 频繁':'正常'}</div>`
      +`<div class="store-value-label">${fmt(p.count)}次</div></div></div>`;
  }).join('');
  const phoneNote=(riskAll.length>riskPhones.length)
    ? `<div class="insight-text" style="font-size:11px;color:#86868b;margin-top:6px">风险号共 ${fmt(riskAll.length)} 个，此处展示前 ${riskPhones.length} 个（按预订次数降序）。</div>` : '';
  const topC=(period.branchList||[]).slice().sort((a,b)=>b.count-a.count)[0];
  const riskInfo = period.riskCount>0
    ? `<span class="tag-red">${period.riskCount}</span> 个手机号周期内预订 ≥${freq} 次，疑似虚假预订/收款不过账，类储值风险，需逐单核查。`
    : '当前周期内无频繁预订手机号（均 < '+freq+' 次），预订行为正常。';

  /* ---------- 会员充值未核销（沉淀）：按最早订金日分档，点选项切换（列表懒渲染，只渲染当前档） ---------- */
  const ru=dash.rechargeUnused||null;
  let rechargeHtml='';
  if(ru){
    _PB={ as_of: ru.as_of||'', phones:(ru.phones||[]).slice().sort((a,b)=>b.amount-a.amount) };
    const chk=ru.buckets||{};
    const chips=BUCKET_DEFS.map(b=>{
      const o=chk[b.k]||{phones:0,amount:0};
      return `<div class="bucket-chip${b.k===_bk?' active':''}" data-bk="${b.k}" onclick="selectBucket('${b.k}')">${b.label} · ${fmt(o.phones)}</div>`;
    }).join('');
    rechargeHtml = `
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-red"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v4H3zM3 10h18v11H3zM7 14h2M11 14h2M15 14h2"/></svg></div>
      <div><div class="card-title">会员充值未核销（沉淀）</div><div class="card-subtitle">截至 ${esc(ru.as_of||'')} · 净未消费订金(实收−已核销−已退)&gt;0</div></div>
    </div></div>
    <div class="insight-text" style="font-size:12px;margin:0 0 10px;color:#1d1d1f;line-height:1.6">
      共 <span class="tag-red">${fmt(ru.total_phones||0)}</span> 个手机号、沉淀 <b>${wan(ru.total_amount||0)}</b> 订金长期未核销/未退；
      按最早订金日分档（60天以上含90天以上，为累计口径）—— 点击下方选项查看对应档位。
    </div>
    <div class="bucket-row">${chips}</div>
    <div id="bucketBody"></div>
    ${actionBox('P0 · 充值未核销逐单核查：核对订金是否真实到账、是否对应真实意向商品；&gt;30天未核销的须联系客户履约或清退，发现资金异常立即上报。')}
  </div>`;
  }
  return `
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-teal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5ac8fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>
      <div><div class="card-title">核心指标</div><div class="card-subtitle">预售 · 频繁预订风险 · ${esc(periodName)}</div></div>
    </div></div>
    <div class="metrics-row">
      ${metric(fmt(period.count),'预订单数','c-blue')}
      ${metric(wan(period.recv),'实收金额','c-teal')}
      ${metric(wan(period.amount),'净未消费','c-blue')}
      ${metric(fmt(period.riskCount),'频繁手机号','c-red')}
    </div>
    <div class="insight-text" style="font-size:12px;margin:2px 0 8px;color:#1d1d1f;line-height:1.6">
      实收 ${wan(period.recv)} · 已核销 ${wan(period.verified)} · 已退 ${wan(period.refund)} → 净未消费 <b>${wan(period.amount)}</b>
    </div>
    <div class="metrics-row">
      ${metric(fmt(period.storeCount),'涉及门店数','c-teal')}
      ${metric(String(dayN),'统计天数','c-gray')}
      ${metric(wan(period.verified),'已核销金额','c-gray')}
      ${metric(wan(period.refund),'已退金额','c-gray')}
    </div>
    ${progress(Math.min(period.riskCount*8,100),'频繁手机号 '+fmt(period.riskCount)+' 个','预订单 '+fmt(period.count)+' 笔')}
    ${insightBox('风险口径','同手机号在「'+esc(periodName)+'」内预订 ≥'+freq+' 次即标红「风险」：疑似员工/渠道刷单、虚假预订或收款不过账，性质类似违规储值，须逐单核查收款与履约。')}
  </div>
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-blue"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0071E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M3 7v14M21 7v14M3 7l9-4 9 4M9 21v-6h6v6"/></svg></div>
      <div><div class="card-title">分公司预订单</div><div class="card-subtitle">${esc(periodName)}</div></div>
    </div></div>
    <div class="detail-list">${branchHtml}</div>
    <div class="detail-section">
      <div class="detail-title">分公司净未消费金额</div>
      <div class="detail-list">${branchDist}</div>
    </div>
    ${topC?insightBox('AI 解读','<span class="tag-blue">'+esc(topC.name)+'</span> 预订单'+fmt(topC.count)+'笔居首，贡献最高。'):''}
  </div>
  ${rechargeHtml}
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-red"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6 4.5 2.3 7.1-6.3-4.6L5.7 21l2.3-7.1-6-4.5h7.6z"/></svg></div>
      <div><div class="card-title">会员手机号 · 频繁预订</div><div class="card-subtitle">风险置顶 · ${esc(periodName)}</div></div>
    </div></div>
    <div class="insight-text" style="font-size:12px;margin:2px 0 10px;color:#1d1d1f;line-height:1.6">${riskInfo}</div>
    <div class="store-list">${phoneHtml}</div>
    ${phoneNote}
    ${actionBox('P0 · 频繁预订手机号逐单核查：确认是否真实收款、是否履约发货；发现收款不过账或无履约立即冻结并上报，参照储值违规处置。')}
  </div>`;
};
boot(loadPreorder,'month');
</script>
<div class="drawer-mask" id="drawerMask" onclick="closePhoneDrawer()"></div>
<div class="drawer" id="phoneDrawer">
  <div class="drawer-head">
    <div><div class="drawer-title" id="dwTitle">—</div><div class="drawer-sub" id="dwSub">逐笔预订单明细</div></div>
    <div class="drawer-close" onclick="closePhoneDrawer()">✕</div>
  </div>
  <div class="drawer-body" id="dwBody"></div>
</div>
<script>
function money(v){ return fmt(Math.round(Number(v)||0)); }
/* 沉淀分档切换：点击对应选项 → 只渲染该档手机号清单（懒渲染，避免 6 档全塞进 DOM） */
function selectBucket(k){
  _bk=k;
  document.querySelectorAll('.bucket-chip').forEach(c=>c.classList.toggle('active',c.dataset.bk===k));
  renderBucketList(k);
}
function renderBucketList(k){
  const box=document.getElementById('bucketBody');
  if(!box || !_PB) return;
  const def=BUCKET_DEFS.find(d=>d.k===k)||BUCKET_DEFS[0];
  const asof=_PB.as_of||'';
  const list=(_PB.phones||[]).filter(p=>def.test(ageDays(p.first_date, asof)));
  const sum=list.reduce((a,x)=>a+(Number(x.amount)||0),0);
  const rows=list.slice(0,60).map(p=>{
    const age=ageDays(p.first_date, asof);
    const hot=age>60;
    const bg=age>90?'超90天':(age>60?'超60天':(age>30?'超30天':''));
    const meta='最早订金 '+p.first_date+' · 距今'+age+'天 · '+p.stores.length+'家店 · '+p.count+'笔';
    return `<div class="store-item tappable"${hot?' style="background:rgba(255,59,48,0.05);border:1px solid rgba(255,59,48,0.15)"':''} onclick="openPhoneDrawer('${p.phone}')">`
      +`<div class="store-info"><div class="store-name">${esc(maskPhone(p.phone))}${bg?` <span class="badge badge-red">${bg}</span>`:''}</div>`
      +`<div class="store-meta">${esc(meta)} <span class="store-tap-hint">· 查看明细›</span></div></div>`
      +`<div class="store-value"><div class="store-value-num ${hot?'c-red':''}">${wan(p.amount)}</div>`
      +`<div class="store-value-label">净未消费</div></div></div>`;
  }).join('');
  box.innerHTML=`<div class="bucket-sum">${def.label}：<span class="tag-red">${fmt(list.length)}</span> 个手机号 · 沉淀 <b>${wan(sum)}</b>
      <span style="color:#86868b;font-size:11px">（按最早订金日；${def.tip}）</span></div>`
    +`<div class="store-list">${rows||'<div class="bucket-empty">该档位暂无手机号</div>'}</div>`
    +(list.length>60?`<div class="insight-text" style="font-size:11px;color:#86868b;margin-top:6px">仅展示金额 TOP60 / 共 ${fmt(list.length)} 个。</div>`:'');
}
/* BUILD 返回字符串、DOM 插入后才可操作 → 用 AFTER_BUILD 钩子渲染当前档列表 */
window.AFTER_BUILD=function(){ if(_PB) renderBucketList(_bk); };
let _poCache=null, _poLoading=null;
async function loadPhoneOrders(){
  if(_poCache) return _poCache;
  if(_poLoading) return _poLoading;
  _poLoading=(async()=>{ try{ const j=await fetchJson(enc('../preorder/phone_orders.json')); _poCache=j||{}; }catch(e){ _poCache={}; } return _poCache; })();
  return _poLoading;
}
function openPhoneDrawer(phone){
  const raw=String(phone||'');
  document.getElementById('dwTitle').textContent=maskPhone(raw);
  document.getElementById('dwSub').textContent='逐笔预订单明细（点遮罩 / ✕ 关闭）';
  document.getElementById('dwBody').innerHTML='<div class="drawer-loading">加载明细中…</div>';
  document.getElementById('drawerMask').classList.add('open');
  document.getElementById('phoneDrawer').classList.add('open');
  loadPhoneOrders().then(data=>renderPhoneOrders(raw,data[raw]||[]));
}
function closePhoneDrawer(){
  document.getElementById('drawerMask').classList.remove('open');
  document.getElementById('phoneDrawer').classList.remove('open');
}
function renderPhoneOrders(phone, arr){
  const body=document.getElementById('dwBody');
  if(!arr.length){ body.innerHTML='<div class="drawer-empty">该手机号在导出中无有效预订单明细</div>'; return; }
  let R=0,V=0,F=0;
  const rows=arr.map(o=>{
    const r=Number(o.r)||0, v=Number(o.v)||0, f=Number(o.f)||0, net=r-v-f;
    R+=r; V+=v; F+=f;
    const ds=String(o.d||'').replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3');
    return `<tr><td>${ds}</td><td class="store" title="${esc(o.s)}">${esc(o.s)}</td>`
      +`<td>${money(r)}</td><td>${money(v)}</td><td>${money(f)}</td>`
      +`<td class="net${net>0?'':' zero'}">${money(net)}</td></tr>`;
  }).join('');
  const net=R-V-F;
  body.innerHTML=`
    <div class="drawer-sum">
      <div class="cell"><b>${fmt(arr.length)}</b><span>笔数</span></div>
      <div class="cell"><b>${money(R)}</b><span>实收</span></div>
      <div class="cell"><b>${money(V)}</b><span>已核销</span></div>
      <div class="cell"><b>${money(F)}</b><span>已退</span></div>
      <div class="cell"><b style="color:#0071E3">${money(net)}</b><span>净未消费</span></div>
    </div>
    <table class="olist"><thead><tr><th>日期</th><th class="store">门店</th><th>实收</th><th>核销</th><th>退</th><th>净额</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="drawer-note">净未消费 = 实收 − 已核销(已转销) − 已退，逐笔口径已按单据编号去重。金额单位：元。</div>`;
}
</script>
</body>
