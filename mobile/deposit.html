<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>会员沉淀 · 移动端</title>
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<div class="header">
  <div class="header-top">
    <div class="header-back" onclick="location.href='index.html'">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg>返回
    </div>
    <div class="header-badge">v2</div>
  </div>
  <div class="header-title">会员沉淀</div>
  <div class="header-date" id="hdrDate"><span class="dot"></span></div>
  <div class="tab-row" id="tabRow"></div>
</div>
<div class="cards" id="cards"></div>
<div class="footer">
  来源：ERP 会员档案 · 判定依据：会员沉淀规则（累计快照，不可加总）<br>
  <span id="genTime"></span><br>
  <a class="footer-link" href="index.html">返回看板总览 ›</a>
</div>
<script src="common.js"></script>
<script>
window.BUILD = function(period, dash, active){
  const de=document.getElementById('hdrDate');
  if(de){ de.innerHTML='<span class="dot"></span>'+(period.date?('快照日期 '+period.date.slice(0,4)+'-'+period.date.slice(4,6)+'-'+period.date.slice(6,8)):(dash.latest_date||'')); }
  const bl=period.branchList||[];
  const maxC=Math.max(0.01,...bl.map(b=>b.count));
  const branchHtml=bl.map((b,i)=>detailItem(i,b.name,fmt(b.count)+' 人',(b.count>=10000?'c-teal':'c-gray'),b.count/maxC*100,'#5ac8fa')).join('');
  const top=bl[0];
  const newTxt = (period.newSum!=null && period.newSum!==0)? ('较昨日新增 <span class="c-teal">'+fmt(period.newSum)+'</span> 人') : '与昨日持平';
  return `
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-teal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5ac8fa" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
      <div><div class="card-title">核心指标</div><div class="card-subtitle">深度 · 累计会员资产</div></div>
    </div></div>
    <div class="metrics-row">
      ${metric(fmt(period.total),'会员沉淀总数','c-teal')}
      ${metric(fmt(period.totalDistinct),'去重会员数','c-teal')}
      ${metric(fmt(period.unconsumed),'未消费会员','c-red')}
      ${metric((period.newSum!=null?fmt(period.newSum):'—'),'较昨日新增','c-teal')}
    </div>
    ${progress(period.total?+(period.totalDistinct/period.total*100).toFixed(2):0,'去重 '+fmt(period.totalDistinct)+' 人','未消费 '+fmt(period.unconsumed)+' 人')}
    <div class="detail-section"><div class="detail-title">${esc(newTxt)}</div></div>
    ${insightBox('口径说明','会员沉淀为「截至某日的累计会员数」快照，<b>不可加总</b>；时间维度=快照日期。已剔除丰管路/内购店及 ASP/AS 结尾门店。')}
  </div>
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-teal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5ac8fa" stroke-width="2"><path d="M3 21h18M3 7v14M21 7v14M3 7l9-4 9 4M9 21v-6h6v6"/></svg></div>
      <div><div class="card-title">各分公司会员沉淀</div><div class="card-subtitle">累计会员数 · 去重</div></div>
    </div></div>
    <div class="detail-list">${branchHtml}</div>
  </div>
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-orange"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff9500" stroke-width="2"><path d="M12 2l2.4 7.4H22l-6 4.5 2.3 7.1-6.3-4.6L5.7 21l2.3-7.1-6-4.5h7.6z"/></svg></div>
      <div><div class="card-title">AI 解读</div><div class="card-subtitle">分公司会员资产分布</div></div>
    </div></div>
    ${top?insightBox('AI 解读','<span class="tag-red">'+esc(top.name)+'</span> 累计沉淀'+fmt(top.count)+'人，占全部会员资产最厚，是复购与连带销售的基本盘；其未消费会员转化空间决定沉睡资产激活收益。'):''}
    ${actionBox('P1 · 沉淀会员按分公司拆解沉睡激活任务，重点提升「未消费会员」首购转化；运营将沉淀净增纳入分公司会员运营考核。')}
  </div>`;
};
boot(loadDeposit,'day');
</script>
</body>
</html>
