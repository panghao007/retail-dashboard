<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>付费会员 · 移动端</title>
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<div class="header">
  <div class="header-top">
    <div class="header-back" onclick="location.href='index.html'">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg>返回
    </div>
    <div class="header-badge">v2</div>
  </div>
  <div class="header-title">付费会员连带率</div>
  <div class="header-date" id="hdrDate"><span class="dot"></span></div>
  <div class="tab-row" id="tabRow"></div>
</div>
<div class="cards" id="cards"></div>
<div class="footer">
  来源：ERP 零售单查询 · 口径：主机清单 + VIP商品编码 · 6家分公司<br>
  <span id="genTime"></span><br>
  <a class="footer-link" href="index.html">返回看板总览 ›</a>
</div>
<script src="common.js"></script>
<script>
/* VIP 档位抽屉：点击有档位的分公司行 / 门店行，展开或收起该行档位明细 */
window.__tierToggle = function(id, el){
  var d = document.getElementById(id);
  if(!d) return;
  d.classList.toggle('open');
  if(el && el.classList && el.classList.contains('tier-head')) el.classList.toggle('open');
};
window.BUILD = function(period, dash, active){
  const de=document.getElementById('hdrDate');
  if(de){ const ds=period.dates||[]; de.innerHTML='<span class="dot"></span>'+(ds.length?('当月 '+ds[0].slice(4,6)+'-'+ds[0].slice(6,8)+' ~ '+ds[ds.length-1].slice(4,6)+'-'+ds[ds.length-1].slice(6,8)+' 共'+ds.length+'天'):(dash.latest_date||'')); }
  const rateColor=r=>r>=30?'c-green':(r>=20?'c-orange':'c-red');
  const periodName=PERIOD_LABEL[active]||'';
  const tierLine=t=>esc(t.name)+' ×'+fmt(t.qty);
  // 分公司行：点击展开「VIP 档位」抽屉（该分公司各档位销售数量）
  const bl=(period.branchList||[]).map((b,i)=>{
    const tiers=b.tiers||[];
    const tid='bt-'+i;
    const attrs=tiers.length?` class="detail-item tier-head" onclick="__tierToggle('${tid}',this)"`:' class="detail-item"';
    return `<div${attrs} style="flex-direction:column;align-items:flex-start;padding:10px 0">
      <div style="width:100%;display:flex;justify-content:space-between;align-items:center">
        <div class="detail-item-name"><div class="rank" style="background:${rankColor(i)}">${i+1}</div>${esc(b.name)}${tiers.length?'<span class="exp">▸</span>':''}</div>
        <div class="detail-item-value ${rateColor(b.rate)}">${b.rate}%</div>
      </div>
      <div style="font-size:11px;color:#86868b;margin-left:24px;margin-top:4px">${esc(b.meta)|| (fmt(b.denominator)+'台 · VIP'+fmt(b.numerator)+' · 产值¥'+(b.value/10000).toFixed(2)+'万 · 纯利¥'+(b.profit/10000).toFixed(2)+'万')}</div>
    </div>${tiers.length?`<div class="tier-drawer" id="${tid}"><span class="tier-tag">VIP 档位</span>${tiers.map(tierLine).join('　·　')}</div>`:''}`;
  }).join('');
  // 分子/分母明细（与率同口径：VIP商品数 ÷ 主机台量）
  const bdDist=(period.branchList||[]).map(b=>`<div class="detail-item"><div class="detail-item-name">${esc(b.name)}</div><div class="detail-item-value c-gray">${fmt(b.numerator)} / ${fmt(b.denominator)} 台</div></div>`).join('');
  // 门店行：点击门店名展开该门店「VIP 档位」抽屉
  const st=(period.storeTop10||[]).map((s,i)=>{
    const tiers=s.tiers||[];
    const tid='st-'+i;
    const attrs=tiers.length?` class="store-item tier-head" onclick="__tierToggle('${tid}',this)"`:' class="store-item"';
    return `<div${attrs}>
      <div class="store-info"><div class="store-name">${esc(s.name)}${tiers.length?'<span class="exp">▸</span>':''}</div>
        <div class="store-meta">${esc((s.company||'')+(s.company?' · ':''))}${fmt(s.denominator)}台 · VIP${fmt(s.numerator)}</div></div>
      <div class="store-value"><div class="store-value-num ${rateColor(s.rate)}">${s.rate}%</div><div class="store-value-label">连带率</div></div>
    </div>${tiers.length?`<div class="tier-drawer" id="${tid}"><span class="tier-tag">VIP 档位</span>${tiers.map(tierLine).join('　·　')}</div>`:''}`;
  }).join('');
  // 产值排名（按产值降序）
  const valRank=(period.branchList||[]).slice().sort((a,b)=>b.value-a.value);
  const maxV=Math.max(1,...valRank.map(b=>b.value));
  const valHtml=valRank.map((b,i)=>detailItem(i,b.name,'¥'+(b.value/10000).toFixed(2)+'万',(b.profit>0?'c-green':'c-orange'),b.value/maxV*100,'#af52de')).join('');
  const top1=(period.branchList||[]).slice().sort((a,b)=>b.rate-a.rate)[0];
  return `
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-purple"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#af52de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6 4.5 2.3 7.1-6.3-4.6L5.7 21l2.3-7.1-6-4.5h7.6z"/></svg></div>
      <div><div class="card-title">核心指标</div><div class="card-subtitle">深度 · 高价值产值 · ${esc(periodName)}</div></div>
    </div></div>
    <div class="metrics-row">
      ${metric(fmt(period.denominator),'主机台量(分母)','c-blue')}
      ${metric(fmt(period.numerator),'VIP商品数(分子)','c-purple')}
      ${metric(period.rate+'%','合计连带率','c-purple')}
      ${metric(period.orderRate+'%','付费会员开单占比','c-teal')}
      ${metric('¥'+(period.value/10000).toFixed(2)+'万','会员产值总计','c-green')}
      ${metric('¥'+(period.profit/10000).toFixed(2)+'万','会员纯利总计','c-orange')}
    </div>
    ${progress(period.rate,'连带率 '+period.rate+'%','')}
    ${insightBox('口径说明','连带率 = VIP会员商品数 ÷ 主机台量。统计6家分公司：北京中恒/四川新跃/北京易联/福建易联/北京飞航/上海爱飞。主机清单 + VIP商品编码定义见通报商品分类-新.xlsx。')}
  </div>
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-purple"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#af52de" stroke-width="2"><path d="M3 21h18M3 7v14M21 7v14M3 7l9-4 9 4M9 21v-6h6v6"/></svg></div>
      <div><div class="card-title">各分公司连带率</div><div class="card-subtitle">产值 · 纯利 · 点击行展开档位</div></div>
    </div></div>
    <div class="detail-list">${bl}</div>
    <div class="detail-section">
      <div class="detail-title">分公司连带率（VIP / 主机台）</div>
      <div class="detail-list">${bdDist}</div>
    </div>
    ${insightBox('AI 解读', top1?('<span class="tag-green">'+esc(top1.name)+'</span> 连带率'+top1.rate+'%全场最高，产值¥'+(top1.value/10000).toFixed(2)+'万领先。对高价值占比低的门店，加强≥1498元档套餐推荐与考核。'):'')}
    ${actionBox('P1 · 对高价值占比低的门店，加强≥1498元档套餐推荐与考核。高连带率分公司总结高客单话术向全集团复制。')}
  </div>
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-purple"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#af52de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M3 7v14M21 7v14M3 7l9-4 9 4M9 21v-6h6v6"/></svg></div>
      <div><div class="card-title">门店连带率 TOP 10</div><div class="card-subtitle">${esc(periodName)} · 按连带率排序 · 点门店名展开档位</div></div>
    </div></div>
    <div class="store-list">${st}</div>
  </div>
  <div class="card">
    <div class="card-head"><div class="card-head-left">
      <div class="card-icon bg-teal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5ac8fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
      <div><div class="card-title">分公司产值排名</div><div class="card-subtitle">会员产值 · 纯利</div></div>
    </div></div>
    <div class="detail-list">${valHtml}</div>
  </div>`;
};
boot(loadPaid,'month');
</script>
</body>
</html>
