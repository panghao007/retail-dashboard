<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>付费会员销售看板 · 会员连带率（多维日期）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f4f6f8;color:#1f2933;padding:0 16px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:900px;margin:0 auto;padding:44px 0 56px;}
  .brandbar{display:inline-block;width:44px;height:5px;border-radius:3px;background:#6366f1;margin-bottom:14px;}
  h1{font-size:25px;font-weight:800;letter-spacing:-.3px;}
  .sub{color:#6b7280;font-size:13.5px;margin-top:8px;line-height:1.6;}
  .selbar{display:flex;align-items:center;gap:10px;margin:24px 0 6px;flex-wrap:wrap;}
  .selbar .lab{font-size:13px;color:#6b7280;font-weight:600;margin-right:4px;}
  .seg{display:inline-flex;background:#fff;border:1px solid #e5e9ef;border-radius:11px;overflow:hidden;}
  .seg button{border:0;background:transparent;padding:9px 16px;font-size:14px;font-weight:600;color:#4b5563;cursor:pointer;transition:all .12s;}
  .seg button.active{background:#6366f1;color:#fff;}
  .seg button:not(.active):hover{background:#eef0fe;}
  .custom{display:none;align-items:center;gap:8px;}
  .custom.show{display:inline-flex;}
  .custom input{font-size:13px;padding:7px 10px;border:1px solid #e5e9ef;border-radius:9px;color:#1f2933;background:#fff;}
  .custom button{font-size:13px;font-weight:600;padding:7px 14px;border:0;border-radius:9px;background:#6366f1;color:#fff;cursor:pointer;}
  .period{font-size:13px;color:#6366f1;font-weight:700;margin:10px 0 2px;}
  .note-upd{font-size:12px;color:#9aa3ad;margin-bottom:8px;}
  .kpis{display:flex;gap:14px;margin:14px 0 6px;flex-wrap:wrap;}
  .kpi{flex:1;min-width:150px;background:#fff;border:1px solid #e5e9ef;border-radius:14px;padding:18px 20px;}
  .kpi .v{font-size:30px;font-weight:800;color:#6366f1;}
  .kpi .v.o{color:#F6AA00;}
  .kpi .l{font-size:13px;color:#9099a5;margin-top:6px;}
  table{width:100%;border-collapse:collapse;margin-top:20px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e5e9ef;}
  th,td{padding:13px 18px;text-align:left;font-size:14.5px;border-bottom:1px solid #f0f2f5;}
  th{background:#fafbfc;color:#6b7280;font-weight:700;font-size:13px;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  td.bn{font-weight:700;white-space:nowrap;}
  td.sn{font-weight:600;font-size:13px;white-space:nowrap;}
  td.rate{width:100px;text-align:center;}
  /* 分公司档位明细子行 */
  tr.tier-row td{background:#f8fafb;border-top:none;padding:6px 12px 9px;}
  td.tier-label{font-size:12.5px;color:#4b5563;line-height:1.7;white-space:normal;}
  .tier-tag{display:inline-block;background:#eef2f7;color:#475569;font-weight:700;font-size:11px;border-radius:4px;padding:1px 7px;margin-right:8px;vertical-align:middle;}
  /* 门店行抽屉展开 */
  .store-row{cursor:pointer;transition:background .15s;}
  .store-row:hover{background:#f0f4f8;}
  .store-row.has-tier td.sn{padding-left:6px;}
  .exp{display:inline-block;font-size:11px;color:#9aa3ad;width:14px;transition:transform .2s;margin-right:2px;}
  .store-row.expanded .exp{transform:rotate(90deg);color:#4b5563;}
  .drawer-row{animation:slideDown .25s ease;}
  @keyframes slideDown{from{opacity:0;max-height:0;}to{opacity:1;max-height:80px;}}
  .drawer-cell{padding:0!important;background:#fafbfc;border-left:3px solid #6366f1!important;}
  .drawer-inner{padding:10px 18px;font-size:12.5px;color:#4b5563;line-height:1.7;}
  .drawer-tag{display:inline-block;background:#eef2f7;color:#475569;font-weight:700;font-size:11px;border-radius:4px;padding:1px 8px;margin-right:8px;}
  .bar{display:inline-block;width:120px;height:9px;background:#eef1f4;border-radius:6px;vertical-align:middle;margin-right:10px;overflow:hidden;}
  .bar span{display:block;height:100%;border-radius:6px;}
  td.rate b{font-size:15px;vertical-align:middle;}
  .bd{margin-top:30px;}
  .bd-title{font-size:14px;font-weight:700;color:#374151;margin-bottom:10px;padding-left:10px;border-left:4px solid #6366f1;}
  .store-table{margin-top:0;}
  .store-table th,.store-table td{padding:9px 16px;font-size:13.5px;}
  .unsold{margin-top:12px;background:#fff7f7;border:1px solid #f3d4d4;border-radius:10px;padding:12px 14px;}
  .unsold.ok{background:#f1fbf4;border-color:#cdeed6;color:#15803d;}
  .us-title{font-size:12.5px;font-weight:700;color:#b91c1c;margin-bottom:8px;}
  .tag{display:inline-block;background:#fde8e8;color:#b91c1c;border:1px solid #f3c7c7;border-radius:7px;
    padding:3px 9px;margin:3px 4px 3px 0;font-size:12.5px;}
  .muted{color:#9aa3ad;font-size:13px;padding:8px 2px;}
  .note{margin-top:22px;background:#fff;border:1px solid #e5e9ef;border-left:4px solid #F6AA00;border-radius:12px;padding:16px 18px;}
  .note h3{font-size:14px;margin-bottom:8px;color:#92400e;}
  .note p{font-size:13px;color:#6b7280;line-height:1.7;}
  .foot{margin-top:26px;color:#9aa3ad;font-size:12px;text-align:center;}
  .warn{color:#dc2626;font-weight:700;}
  .loading{padding:40px 0;text-align:center;color:#9099a5;font-size:14px;}
  /* 趋势图表 */
  .trend-btns{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .trend-btn{border:1px solid #e5e9ef;background:#fff;border-radius:20px;padding:6px 16px;font-size:13px;font-weight:600;
    color:#4b5563;cursor:pointer;transition:all .15s;}
  .trend-btn.active{background:#6366f1;color:#fff;border-color:#6366f1;}
  .trend-btn:not(.active):hover{background:#eef0fe;}
  .chart-wrap{position:relative;width:100%;height:340px;}
  .chart-wrap canvas{width:100%!important;height:100%!important;}
  .trend-legend{display:flex;gap:18px;margin-bottom:6px;font-size:13px;}
  .trend-legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
  .trend-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}
  .trend-legend span.off{opacity:.4;}
  .trend-tip{position:absolute;pointer-events:none;background:rgba(31,41,51,.92);color:#fff;font-size:12px;
    padding:7px 10px;border-radius:8px;line-height:1.6;white-space:nowrap;display:none;z-index:9;transform:translate(-50%,-100%);}
  /* ── 移动端/云之家WebView适配 ── */
  @media(max-width:768px){
    body{padding:14px; -webkit-text-size-adjust:100%;}
    h1{font-size:21px;} .sub{font-size:11.5px;}
    .selbar .lab,.period,.note-upd{font-size:11.5px;}
    .seg button{font-size:12px;padding:7px 12px;}
    .custom input,.custom button{font-size:11.5px;}
    .kpi .v{font-size:25px;} .kpi .l{font-size:11.5px;}
    th,td{padding:9px 13px;font-size:12.5px;} th{font-size:11.5px;} td.sn{font-size:11.5px;}
    td.tier-label{font-size:11px;}
    .trend-legend{font-size:11px;} .trend-tip{font-size:10.5px;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brandbar"></div>
    <h1>付费会员销售看板 · 会员连带率</h1>
    <div class="sub">来源：ERP 零售单-零售单查询（当月-全部公司）｜ 口径：通报商品分类-新.xlsx·主机清单 + VIP商品编码 ｜ 仅统计北京中恒 / 四川新跃 / 北京易联 / 福建易联 四家分公司</div>
    <div class="selbar">
      <span class="lab">时间维度</span>
      <div class="seg" id="seg">
        <button data-mode="当日">当日</button>
        <button data-mode="昨日">昨日</button>
        <button data-mode="当月" class="active">当月</button>
        <button data-mode="自定义">自定义</button>
      </div>
      <div class="custom" id="custom">
        <input type="date" id="cstart">
        <span style="color:#9aa3ad">至</span>
        <input type="date" id="cend">
        <button id="capply">应用</button>
      </div>
    </div>
    <div class="period" id="period"></div>
    <div class="note-upd" id="noteUpd"></div>
    <div id="content"><div class="loading">加载中…</div></div>
  </div>
<script>
const BRANCHES = ["北京中恒","四川新跃","北京易联","福建易联"];
// 本月（2026-08）新开分公司起始销售日：起始日之前的天数对该分公司不计入统计窗口（剔除）。
// 仅对 2026-08 生效，以后月份（2026-09 起）自动不过滤。
const BRANCH_START_2026_08 = {
  "北京易联":"2026-08-03", "福建易联":"2026-08-03",
  "北京中恒":"2026-08-11", "四川新跃":"2026-08-11"
};
function branchStart(b, date){
  if(date && date.indexOf("2026-08")===0) return BRANCH_START_2026_08[b]||null;
  return null;
}
let INDEX = [];          // 可用日期列表（升序）
let GENERATED = "";
let DAILY = {};          // 缓存 date -> json
let MODE = "当月";
let CUSTOM = {start:null, end:null};

function bjDate(d){ // d: Date -> 'YYYY-MM-DD' (北京)
  const bj = new Date(d.getTime()+8*3600000);
  return bj.toISOString().slice(0,10);
}
function todayBJ(){ return bjDate(new Date()); }
function prevDay(s){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()-1); return bjDate(d); }
function fmtDate(s){ return s.replace(/-/g,''); }

async function loadIndex(){
  const t = todayBJ();
  const cands = [t, prevDay(t), prevDay(prevDay(t))];
  for(const c of cands){
    try{
      const r = await fetch('daily_index_'+fmtDate(c)+'.json', {cache:'no-store'});
      if(r.ok){ const j = await r.json(); INDEX = j.dates||[]; GENERATED = j.generated||""; return; }
    }catch(e){}
  }
  try{ const r = await fetch('daily_index.json', {cache:'no-store'}); if(r.ok){ const j=await r.json(); INDEX=j.dates||[]; GENERATED=j.generated||""; } }catch(e){}
}
async function loadDay(date){
  if(DAILY[date]) return DAILY[date];
  const r = await fetch('daily/'+fmtDate(date)+'.json', {cache:'no-store'});
  const j = await r.json(); DAILY[date]=j; return j;
}
function wantDates(){
  const t=todayBJ(), y=prevDay(t), ms=t.slice(0,8)+"01";
  if(MODE==="当日") return [t];
  if(MODE==="昨日") return [y];
  if(MODE==="当月") return INDEX.filter(d=>d>=ms && d<=y);
  if(MODE==="自定义") return INDEX.filter(d=>d>=(CUSTOM.start||"0000") && d<=(CUSTOM.end||"9999"));
  return [];
}
function availableDates(){
  const want=wantDates();
  const av=want.filter(d=>INDEX.includes(d));
  return {want, av, missing:want.filter(d=>!INDEX.includes(d))};
}
function selectedLabel(want){
  if(want.length===0) return "（无数据）";
  if(MODE==="当日") return "当日（"+want[0]+"）";
  if(MODE==="昨日") return "昨日（"+want[0]+"）";
  if(MODE==="当月") return "当月累积（"+want[0]+" ~ "+want[want.length-1]+"）";
  if(MODE==="自定义") return "自定义（"+(CUSTOM.start||"?")+" ~ "+(CUSTOM.end||"?")+"）";
  return "";
}
function aggregate(js){
  const total={denominator:0,numerator:0,order_denom:0,order_num:0};
  const branches={};
  BRANCHES.forEach(b=>branches[b]={denominator:0,numerator:0,order_denom:0,order_num:0,vip:{},stores:{}});
  js.forEach(d=>{
    BRANCHES.forEach(b=>{
      const _bs=branchStart(b, d.date);
      if(_bs && d.date < _bs) return;  // 本月该分公司尚未开始销售，剔除该日该分支
      const bd=d.branches[b]||{denominator:0,numerator:0,order_denom:0,order_num:0};
      total.denominator+=bd.denominator; total.numerator+=bd.numerator;
      total.order_denom+=bd.order_denom; total.order_num+=bd.order_num;
      branches[b].denominator+=bd.denominator; branches[b].numerator+=bd.numerator;
      branches[b].order_denom+=bd.order_denom; branches[b].order_num+=bd.order_num;
      (bd.vip_items||[]).forEach(it=>{
        if(!branches[b].vip[it.code]) branches[b].vip[it.code]={name:it.name,qty:0};
        branches[b].vip[it.code].qty += it.qty;
      });
      d.stores.filter(s=>s.branch===b).forEach(s=>{
        const o=branches[b].stores[s.store]||{denominator:0,numerator:0,order_denom:0,order_num:0,vip:{}};
        o.denominator+=s.denominator; o.numerator+=s.numerator;
        o.order_denom+=s.order_denom; o.order_num+=s.order_num;
        (s.vip_items||[]).forEach(it=>{
          if(!o.vip[it.code]) o.vip[it.code]={name:it.name,qty:0};
          o.vip[it.code].qty += it.qty;
        });
        branches[b].stores[s.store]=o;
      });
    });
  });
  return {total, branches, isRange: js.length>1};
}
function rateColor(rate){
  if(rate>=10) return "#16a34a";
  if(rate>=5) return "#F6AA00";
  return "#dc2626";
}
function pct(x){ return (x*100).toFixed(2)+"%"; }
function draw(agg, dates, want){
  const total=agg.total;
  const totRate = total.denominator? total.numerator/total.denominator : 0;
  // 付费会员开单占比 = 有VIP销售的门店数 / 主数据门店总数（门店维度二元判定）
  let totalStores=0, openStores=0;
  BRANCHES.forEach(b=>{
    Object.keys(agg.branches[b].stores).forEach(s=>{
      totalStores++;
      if(agg.branches[b].stores[s].numerator>0) openStores++;
    });
  });
  const totOpenRate = totalStores? openStores/totalStores : 0;
  // KPI
  let kpi = '<div class="kpis">'
    + '<div class="kpi"><div class="v">'+total.denominator.toFixed(0)+'</div><div class="l">主机台量（分母）</div></div>'
    + '<div class="kpi"><div class="v o">'+total.numerator.toFixed(0)+'</div><div class="l">VIP会员商品数（分子）</div></div>'
    + '<div class="kpi"><div class="v">'+pct(totRate)+'</div><div class="l">合计会员连带率</div></div>'
    + '<div class="kpi"><div class="v">'+pct(totOpenRate)+'</div><div class="l">付费会员开单占比（'+openStores+'/'+totalStores+' 门店）</div></div>'
    + '</div>';

  // 分公司表
  let maxRate = Math.max.apply(null, BRANCHES.map(b=>agg.branches[b].denominator?agg.branches[b].numerator/agg.branches[b].denominator:0)) || 1;
  let rows="";
  BRANCHES.forEach(b=>{
    const bd=agg.branches[b];
    const rate = bd.denominator? bd.numerator/bd.denominator : 0;
    const col=rateColor(rate*100);
    const w=(rate/maxRate*100);
    // 门店售/总/未售（主机维度）
    const master=Object.keys(bd.stores).length;
    let sold=0, unsold=[];
    let bOpen=0;
    Object.keys(bd.stores).forEach(s=>{
      const o=bd.stores[s];
      if(o.denominator>0||o.numerator>0) sold++; else unsold.push(s);
      if(o.numerator>0) bOpen++;
    });
    rows+='<tr>'
      +'<td class="bn">'+b+'</td>'
      +'<td class="num">'+bd.denominator.toFixed(0)+'</td>'
      +'<td class="num">'+bd.numerator.toFixed(0)+'</td>'
      +'<td class="rate"><b style="color:'+col+'">'+pct(rate)+'</b></td>'
      +'<td class="num">'+bOpen+'/'+master+'（'+pct(bOpen/master)+'）</td>'
      +'</tr>';
    // 档位明细子行：该分公司各 VIP 商品档位卖了几个
    const tierItems=Object.keys(bd.vip||{}).map(c=>({name:(bd.vip[c].name||c).replace(/会员套餐?/,''), qty:bd.vip[c].qty}))
      .sort((x,y)=>y.qty-x.qty);
    if(tierItems.length){
      const tierStr=tierItems.map(it=>it.name+' ×'+it.qty).join('　·　');
      rows+='<tr class="tier-row"><td class="tier-label" colspan="5"><span class="tier-tag">档位明细</span>'+tierStr+'</td></tr>';
    }
  });
  let branchTable='<table><thead><tr><th>所属分公司</th><th style="text-align:right">主机台量</th>'
    +'<th style="text-align:right">VIP数</th><th>会员连带率</th><th style="text-align:right">付费会员开单(门店)</th></tr></thead><tbody>'+rows+'</tbody></table>';

  let html = kpi + branchTable;

  // 每日趋势（区间模式）—— 折线图 + 分公司切换
  if(agg.isRange){
    const trendBtns = ['全部', ...BRANCHES].map(b =>
      '<button class="trend-btn'+(b==='全部'?' active':'')+'" data-trend-branch="'+b+'">'+b+'</button>'
    ).join('');
    html+='<div class="bd"><div class="bd-title">每日趋势（会员连带率 / 开单占比）</div>'
      +'<div class="trend-btns">'+trendBtns+'</div>'
      +'<div class="trend-legend"><span data-line="rate"><i style="background:#6366f1"></i>会员连带率(%)</span>'
      +'<span data-line="open"><i style="background:#f59e0b"></i>开单占比(%)</span></div>'
      +'<div class="chart-wrap"><canvas id="trendChart"></canvas><div class="trend-tip" id="trendTip"></div></div></div>';
  }

  // 门店明细 + 未售（区间模式展示未售清单）
  BRANCHES.forEach(b=>{
    const bd=agg.branches[b];
    const items=Object.keys(bd.stores).map(s=>({store:s, ...bd.stores[s]}))
      .filter(o=>o.denominator>0||o.numerator>0)
      .sort((a,b)=> (b.denominator?b.numerator/b.denominator:0)-(a.denominator?a.numerator/a.denominator:0));
    const master=Object.keys(bd.stores).length;
    let sold=0, unsold=[];
    Object.keys(bd.stores).forEach(s=>{ const o=bd.stores[s]; if(o.denominator>0||o.numerator>0) sold++; else unsold.push(s); });
    let sec='<div class="bd"><div class="bd-title">'+b+' · 门店明细（销售 '+sold+'/'+master+' 家）</div>';
    if(items.length){
      let maxr=Math.max.apply(null, items.map(o=>o.denominator?o.numerator/o.denominator:0))||1;
      let sr="";
      items.forEach((o,si)=>{
        const rate=o.denominator? o.numerator/o.denominator:null;
        const opened=o.numerator>0;
        const openCell=opened? '<span style="color:#16a34a;font-weight:700">有</span>' : '<span style="color:#9aa3ad">无</span>';
        const rid='sr-'+b.replace(/\s/g,'-')+'-'+si;
        // 门店级 VIP 档位
        const tierItems=Object.keys(o.vip||{}).map(c=>({name:(o.vip[c].name||c).replace(/会员套餐?/,''), qty:o.vip[c].qty}))
          .sort((x,y)=>y.qty-x.qty);
        const hasTier=tierItems.length>0;
        if(rate===null){
          sr+='<tr class="store-row'+(hasTier?' has-tier':'')+'" data-rid="'+rid+'"><td class="sn">'+(hasTier?'<span class="exp">▸</span> ':'')+o.store+'</td><td class="num">'+o.denominator.toFixed(0)+'</td>'
            +'<td class="num">'+o.numerator.toFixed(0)+'</td><td class="rate"><b style="color:#9aa3ad">—</b></td>'
            +'<td>'+openCell+'</td></tr>';
        }else{
          const col=rateColor(rate*100); const w=(rate/maxr*100);
          sr+='<tr class="store-row'+(hasTier?' has-tier':'')+'" data-rid="'+rid+'"><td class="sn">'+(hasTier?'<span class="exp">▸</span> ':'')+o.store+'</td><td class="num">'+o.denominator.toFixed(0)+'</td>'
            +'<td class="num">'+o.numerator.toFixed(0)+'</td>'
            +'<td class="rate"><b style="color:'+col+'">'+pct(rate)+'</b></td>'
            +'<td>'+openCell+'</td></tr>';
        }
        if(hasTier){
          const tierStr=tierItems.map(it=>it.name+' ×'+it.qty).join('　·　');
          sr+='<tr id="'+rid+'" class="drawer-row" style="display:none"><td colspan="5" class="drawer-cell">'
            +'<div class="drawer-inner"><span class="drawer-tag">VIP 档位</span>'+tierStr+'</div></td></tr>';
        }
      });
      sec+='<table class="store-table"><thead><tr><th>门店</th><th style="text-align:right">主机台量(分母)</th>'
        +'<th style="text-align:right">VIP数(分子)</th><th>会员连带率</th><th>付费会员开单</th></tr></thead><tbody>'+sr+'</tbody></table>';
    }else{
      sec+='<p class="muted">当期无主机销售门店。</p>';
    }
    // 付费会员商品销售明细：区分该分公司具体卖了哪些会员商品
    if(bd.vip && Object.keys(bd.vip).length){
      let vr="";
      const vk=Object.keys(bd.vip).sort((x,y)=>bd.vip[y].qty-bd.vip[x].qty);
      vk.forEach(k=>{ const it=bd.vip[k];
        vr+='<tr><td class="sn">'+k+'</td><td>'+it.name+'</td><td class="num">'+it.qty.toFixed(0)+'</td></tr>';
      });
      sec+='<div class="bd" style="margin-top:14px"><div class="bd-title">付费会员商品销售明细（'+Object.keys(bd.vip).length+' 种）</div>'
        +'<table class="store-table"><thead><tr><th>商品编码</th><th>商品名称</th><th style="text-align:right">VIP数</th></tr></thead><tbody>'+vr+'</tbody></table></div>';
    }
    if(agg.isRange){
      if(unsold.length){
        sec+='<div class="unsold"><div class="us-title">未售门店（'+unsold.length+' 家 · 当期主机台量=0）</div>'
          + unsold.map(x=>'<span class="tag">'+x+'</span>').join('') + '</div>';
      }else{
        sec+='<div class="unsold ok">✅ 该分公司所有门店当期均有主机销售</div>';
      }
    }
    sec+='</div>';
    html+=sec;
  });

  html+='<div class="note"><h3>口径说明</h3><p>'
    +'· <b>分母（主机台量）</b>：依据《通报商品分类-新.xlsx》sheet4 主机清单，商品编码命中的行；剔除「买断 / 礼品机出库 / 线上订单」，按销售数量正项求和；<b>门店 sheet「属性」=生活馆 的门店（11 个）不计入分母</b>（其 VIP 销售仍计入分子）。<br>'
    +'· <b>分子（VIP会员商品）</b>：商品编码精确匹配《通报商品分类-新.xlsx》sheet「付费会员商品」的付费会员物料编码，与分母同口径剔除。<br>'
    +'· <b>会员连带率</b> = 分子 ÷ 分母；<b>付费会员开单占比</b> = 区间内「有 VIP 会员商品销售」的门店数 ÷ 四家分公司主数据门店总数（门店维度二元判定：卖过 VIP 即「有」，未卖即「无」）。<br>'
    +'· <b>门店销售(售/总)</b>：分公司主数据（门店sheet）中，当期主机台量&gt;0 的门店数 / 主数据门店总数。<br>'
    +'· <b>未售门店</b>：仅「当月 / 自定义」区间维度展示——主数据中当期主机台量=0 的门店（单日维度不展示逐日未售清单）。<br>'
    +'· <b>退货处理</b>：退货状态「已退货」整行剔除；「部分退货」按 实售=销售数量−已退数量 计入。<br>'
    +'· ⚠️ 各分公司 VIP 编码均来自《通报商品分类-新.xlsx》sheet「付费会员商品」（北京中恒=vip-iphone* / 四川新跃=SCXYVIP* / 北京易联=BJYLVIP* / 福建易联=FJYLVIP*）。<br>'
    +'· 各分公司区块下方「付费会员商品销售明细」列出该分公司当期具体售出的会员商品（按商品编码 / 名称 / VIP数），便于核对都卖了哪些付费会员商品。</p></div>';
  html+='<div class="foot">数据来源：ERP 零售单导出（与会员有效性同源）· <span class="warn">内含经营敏感数据，请勿外传</span></div>';
  document.getElementById('content').innerHTML = html;
  // 门店行点击展开/收起 VIP 档位抽屉
  document.querySelectorAll('.store-row.has-tier').forEach(function(tr){
    tr.addEventListener('click', function(){
      var rid=this.getAttribute('data-rid');
      var dr=document.getElementById(rid);
      if(dr){
        var vis=dr.style.display!=='none';
        dr.style.display=vis?'none':'table-row';
        this.classList.toggle('expanded', !vis);
      }
    });
  });
  // 趋势折线图（原生 Canvas，无外部依赖）+ 分公司切换
  (function(){
    var cv=document.getElementById('trendChart'); if(!cv) return;
    var wrap=cv.parentElement;
    var dpr=window.devicePixelRatio||1;
    var activeBranch='全部';
    var showLine={rate:true, open:true};
    var curData=null;
    function fmtDay(ds){ var m=String(ds).match(/(\d{1,2})$/); return (m?m[1]:ds)+'日'; }

    function makeData(branch){
      var labels=[], rateData=[], openData=[];
      dates.forEach(function(dt){
        var d=DAILY[dt]; if(!d) return;
        labels.push(fmtDay(dt));
        var src=(branch==='全部')?d.total:(d.branches[branch]||null);
        if(src){
          var r=src.denominator? src.numerator/src.denominator:0;
          rateData.push(Math.round(r*10000)/100);
          var ts=0,os=0;
          if(branch==='全部'){
            d.stores.forEach(function(s){ts++;if(s.numerator>0)os++;});
          }else{
            d.stores.forEach(function(s){if(s.branch===branch){ts++;if(s.numerator>0)os++;}});
          }
          openData.push(ts?Math.round(os/ts*10000)/100:0);
        }else{
          rateData.push(null); openData.push(null);
        }
      });
      return {labels:labels, rate:rateData, open:openData};
    }

    function xAt(i,n,cw,pl){ return n>1? pl+cw*i/(n-1) : pl+cw/2; }
    function yAt(v,maxV,ch,pt){ return pt+ch-(v/maxV)*ch; }

    function drawChart(){
      var d=makeData(activeBranch);
      curData=d;
      var w=cv.clientWidth, h=cv.clientHeight;
      if(!w||!h) return;
      cv.width=w*dpr; cv.height=h*dpr;
      var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,w,h);
      var pl=48, pr=48, pt=18, pb=36;
      var cw=w-pl-pr, ch=h-pt-pb;
      var n=d.labels.length; if(!n) return;
      var maxV=0;
      if(showLine.rate) d.rate.forEach(function(v){ if(v!=null) maxV=Math.max(maxV,v); });
      if(showLine.open) d.open.forEach(function(v){ if(v!=null) maxV=Math.max(maxV,v); });
      maxV=Math.ceil(maxV/10)*10 || 10;
      // 网格 + Y 轴标签
      ctx.strokeStyle='#eef0f3'; ctx.lineWidth=1;
      ctx.fillStyle='#9aa3ad'; ctx.font='11px -apple-system,sans-serif';
      ctx.textAlign='right'; ctx.textBaseline='middle';
      var steps=5;
      for(var i=0;i<=steps;i++){
        var val=maxV*i/steps, y=yAt(val,maxV,ch,pt);
        ctx.beginPath(); ctx.moveTo(pl,y); ctx.lineTo(pl+cw,y); ctx.stroke();
        ctx.fillText(val+'%', pl-6, y);
      }
      // X 轴标签（竖向，防手机叠压）
      ctx.fillStyle='#9aa3ad'; ctx.font='11px -apple-system,sans-serif';
      d.labels.forEach(function(lb,i){
        var x=xAt(i,n,cw,pl);
        ctx.save(); ctx.translate(x,pt+ch+6); ctx.rotate(-Math.PI/2); ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillText(lb,0,0); ctx.restore();
      });
      // 画线
      function plot(data,color){
        ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.beginPath();
        var started=false;
        data.forEach(function(v,i){
          var x=xAt(i,n,cw,pl);
          if(v==null){started=false; return;}
          var y=yAt(v,maxV,ch,pt);
          if(!started){ctx.moveTo(x,y); started=true;} else ctx.lineTo(x,y);
        });
        ctx.stroke();
        data.forEach(function(v,i){
          if(v==null) return;
          var x=xAt(i,n,cw,pl), y=yAt(v,maxV,ch,pt);
          ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,3.4,0,Math.PI*2); ctx.fill();
          ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,3.4,0,Math.PI*2); ctx.stroke();
        });
      }
      if(showLine.rate) plot(d.rate,'#6366f1');
      if(showLine.open) plot(d.open,'#f59e0b');
      // 存几何供 tooltip
      cv._geo={pl:pl,pt:pt,cw:cw,ch:ch,maxV:maxV,n:n};
    }

    // 按钮切换分公司（从 .bd 父级查找，因按钮在 .trend-btns 兄弟节点中）
    var bdPanel=wrap.parentElement;
    bdPanel.querySelectorAll('.trend-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        bdPanel.querySelectorAll('.trend-btn').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        activeBranch=this.getAttribute('data-trend-branch');
        drawChart();
      });
    });
    // 图例点击切换显隐
    bdPanel.querySelectorAll('.trend-legend span').forEach(function(sp){
      sp.addEventListener('click', function(){
        var k=this.getAttribute('data-line');
        showLine[k]=!showLine[k];
        this.classList.toggle('off', !showLine[k]);
        drawChart();
      });
    });
    // tooltip
    var tip=document.getElementById('trendTip');
    cv.addEventListener('mousemove', function(e){
      if(!curData||!cv._geo){ return; }
      var rect=cv.getBoundingClientRect();
      var mx=e.clientX-rect.left;
      var g=cv._geo, n=g.n;
      // 找最近点
      var idx=0, best=1e9;
      for(var i=0;i<n;i++){
        var x=xAt(i,n,g.cw,g.pl);
        if(Math.abs(x-mx)<best){ best=Math.abs(x-mx); idx=i; }
      }
      var x=xAt(idx,n,g.cw,g.pl);
      var lines=[];
      if(showLine.rate && curData.rate[idx]!=null) lines.push('<b style="color:#a5b4fc">会员连带率 '+curData.rate[idx]+'%</b>');
      if(showLine.open && curData.open[idx]!=null) lines.push('<b style="color:#fcd34d">开单占比 '+curData.open[idx]+'%</b>');
      if(!lines.length) return;
      tip.innerHTML='<div style="opacity:.7;margin-bottom:2px">'+curData.labels[idx]+' · '+activeBranch+'</div>'+lines.join('<br>');
      tip.style.display='block';
      tip.style.left=x+'px';
      tip.style.top=(yAt(Math.max(curData.rate[idx]||0,curData.open[idx]||0),g.maxV,g.ch,g.pt)-10)+'px';
    });
    cv.addEventListener('mouseleave', function(){ if(tip) tip.style.display='none'; });

    drawChart();
  })();
  document.getElementById('period').textContent = "统计周期：" + selectedLabel(want||[]);
  var nowBJ = new Date(new Date().getTime()+8*3600000);
  var todayStr = nowBJ.toISOString().slice(0,10);
  document.getElementById('noteUpd').innerHTML = GENERATED ? ("数据更新于 <b>"+GENERATED+"</b> ｜ 今日 <b>"+todayStr+"</b>；当日数据需当天重导 ERP 后生成") : "";
}
async function render(){
  document.getElementById('content').innerHTML='<div class="loading">加载中…</div>';
  const {want, av, missing}=availableDates();
  if(av.length===0){
    let msg='';
    if(MODE==="当日") msg='今日（'+want[0]+'）数据尚未导出（ERP 数据为 T+1）。最新可用数据截至 '+(INDEX.length?INDEX[INDEX.length-1]:'无')+'。';
    else if(MODE==="昨日") msg='昨日（'+want[0]+'）数据暂不可用。';
    else msg='所选范围内暂无导出数据。';
    document.getElementById('content').innerHTML='<div class="loading">'+msg+'</div>';
    document.getElementById('period').textContent="统计周期："+selectedLabel(want);
    document.getElementById('noteUpd').textContent=GENERATED?("数据更新于 "+GENERATED):"";
    return;
  }
  try{
    const js=await Promise.all(av.map(loadDay));
    draw(aggregate(js), av, want);
  }catch(e){
    document.getElementById('content').innerHTML='<div class="loading">数据加载失败：'+e+'</div>';
  }
}
// 事件
document.getElementById('seg').addEventListener('click', e=>{
  const btn=e.target.closest('button'); if(!btn) return;
  MODE=btn.dataset.mode;
  [...document.querySelectorAll('#seg button')].forEach(b=>b.classList.toggle('active', b===btn));
  document.getElementById('custom').classList.toggle('show', MODE==="自定义");
  render();
});
document.getElementById('capply').addEventListener('click', ()=>{
  CUSTOM.start=document.getElementById('cstart').value||null;
  CUSTOM.end=document.getElementById('cend').value||null;
  if(CUSTOM.start) render();
});
(async function(){
  await loadIndex();
  const t = todayBJ(), y = prevDay(t);
  document.getElementById('cstart').value = t.slice(0,8)+"01";
  document.getElementById('cend').value = y;
  render();
})();
</script>
