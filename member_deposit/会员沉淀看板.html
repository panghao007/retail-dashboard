<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会员沉淀看板</title>
<style>
*{box-sizing:border-box;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fa;color:#1f2937;margin:0;padding:0;}
.head{background:linear-gradient(120deg,#10b981,#0e9f6e);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.head h1{margin:0;font-size:21px} .head p{margin:3px 0 0;opacity:.92;font-size:12.5px}
.bar{display:flex;gap:8px;background:rgba(255,255,255,.18);padding:6px;border-radius:11px;flex-wrap:wrap}
.bar button{border:0;background:transparent;color:#fff;font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer;opacity:.8}
.bar button.on{background:#fff;color:#0e9f6e;opacity:1}
.cust{display:none;gap:8px;align-items:center;margin-left:6px;color:#fff;font-size:13px}
.cust input{border:0;border-radius:7px;padding:6px 8px;font-size:13px;color:#1f2d3d}
.kpis{display:flex;gap:14px;padding:18px 24px;flex-wrap:wrap}
.kpi{flex:1;min-width:150px;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(16,24,40,.08);padding:16px 18px}
.kpi .v{font-size:28px;font-weight:800;color:#10b981} .kpi .l{font-size:12px;color:#6b7280;margin-top:2px}
.kpi.warn-k .v{color:#f97316}
.sec{background:#fff;margin:0 24px 16px;border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.sec h2{font-size:16px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.branddot{width:10px;height:10px;border-radius:3px;background:#10b981;display:inline-block;}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eef1f5}
th{color:#6b7280;font-weight:600;font-size:12px;background:#fafbfc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
td.bname{font-weight:600}
.delta{font-weight:700} .delta.up{color:#10b981} .delta.down{color:#ef4444} .delta.flat{color:#9ca3af}
.note{color:#6b7280;font-size:12px;margin-top:10px;line-height:1.7}
.warn{background:#fff4f4;border:1px solid #f3c9c9;color:#b42318;padding:10px 14px;border-radius:10px;font-size:13px;margin-top:8px}
.branch-block{margin-top:14px}
.branch-name{font-size:13px;font-weight:700;color:#10b981;margin-bottom:6px;padding-left:8px;border-left:3px solid #10b981}
#period{font-weight:600;color:#fff}
#mwrap{padding:8px 24px 0;font-size:13px;color:#fff}
</style></head><body>
<div class="head">
  <div><h1>会员沉淀看板</h1><p>以「首次购买门店」归属分公司 ｜ 截至所选日期的累计会员数（快照，不可加总）</p></div>
  <div class="bar">
    <button data-m="当日" onclick="setMode('当日')">当日</button>
    <button data-m="昨日" onclick="setMode('昨日')">昨日</button>
    <button data-m="当月" onclick="setMode('当月')">当月</button>
    <button data-m="自定义" onclick="setMode('自定义')">自定义</button>
    <span class="cust" id="cust"><input type="date" id="cstart"> ~ <input type="date" id="cend"><button class="dl" style="padding:5px 12px;background:#fff;color:#0e9f6e;border:0;border-radius:8px;cursor:pointer;font-weight:600" onclick="applyCustom()">应用</button></span>
  </div>
</div>
<div id="mwrap">统计周期：<span id="period">加载中…</span> ｜ <span id="noteUpd"></span></div>
<div id="content"><div class="note" style="padding:18px 24px">加载中…</div></div>

<script>
var BRANCH_ORDER = ["上海爱飞", "北京中恒", "北京易联", "北京飞航", "四川新跃", "福建易联", "未消费会员"];
var EXCLUDED_KW = ["丰管路", "内购店"];
var NOTE = "会员沉淀为「截至某日的累计会员数」快照，不可加总；时间维度=快照日期。历史每日快照自 2026-08-11 起累积，更早日期暂无快照（会员档案为时点拉取）。";
var GENERATED = "2026-09-04 23:29";
var MODE = "当日";
var INDEX = [];
var SNAPS = {};
var CUSTOM = {start:"", end:""};

function bjNow(){ var n=new Date(); return new Date(n.getTime()+(n.getTimezoneOffset()+480)*60000); }
function todayKey(){ var b=bjNow(); var m=('0'+(b.getMonth()+1)).slice(-2), d=('0'+b.getDate()).slice(-2); return ''+b.getFullYear()+m+d; }
function keyToYmd(k){ k=''+k; return k? (k.slice(0,4)+"-"+k.slice(4,6)+"-"+k.slice(6,8)) : ""; }
function ymdToKey(s){ return s? (''+s).replace(/-/g,"") : ""; }
function prevKey(k){ k=''+k; var y=+k.slice(0,4),m=+k.slice(4,6),d=+k.slice(6,8); var dt=new Date(y,m-1,d); dt.setDate(dt.getDate()-1); var mm=('0'+(dt.getMonth()+1)).slice(-2), dd=('0'+dt.getDate()).slice(-2); return ''+dt.getFullYear()+mm+dd; }
function firstOfMonthKey(k){ k=''+k; return k.slice(0,4)+k.slice(4,6)+'01'; }
function idxName(k){ return "daily_index_"+k+".json"; }
async function loadIndex(){
  var k=todayKey();
  for(var i=0;i<10;i++){
    try{ var r=await fetch(idxName(k)); if(r.ok){ var j=await r.json(); INDEX=j.dates||[]; return; } }catch(e){}
    k=prevKey(k);
  }
  INDEX=[];
}
function loadSnap(k){ if(SNAPS[k]) return Promise.resolve(SNAPS[k]); return fetch("daily/"+k+".json").then(function(r){return r.json();}).then(function(j){SNAPS[k]=j;return j;}).catch(function(){return null;}); }
function selectedDates(){
  if(INDEX.length===0) return [];
  var t=todayKey();
  if(MODE==="当日") return [t];
  if(MODE==="昨日") return [prevKey(t)];
  if(MODE==="当月"){ var ms=firstOfMonthKey(t); var ye=prevKey(t); return INDEX.filter(function(d){return d>=ms && d<=ye;}); }
  if(MODE==="自定义"){ return INDEX.filter(function(d){return d>=(CUSTOM.start||"0000") && d<=(CUSTOM.end||"99999999");}); }
  return [];
}
function selectedLabel(dates){
  if(dates.length===0) return "（无数据）";
  if(MODE==="当日") return "当日（"+keyToYmd(dates[0])+"）"+(INDEX.indexOf(dates[0])<0?" · 当日快照尚未生成，最新可用截至 "+keyToYmd(INDEX[INDEX.length-1]):"");
  if(MODE==="昨日") return "昨日（"+keyToYmd(dates[0])+"）";
  if(MODE==="当月") return "当月累积（截至 "+keyToYmd(dates[dates.length-1])+"）";
  if(MODE==="自定义") return "自定义（"+(CUSTOM.start?keyToYmd(CUSTOM.start):"?")+" ~ "+(CUSTOM.end?keyToYmd(CUSTOM.end):"?")+"）";
  return "";
}
function prevInIndex(k){ for(var i=INDEX.length-1;i>=0;i--){ if(INDEX[i]<k) return INDEX[i]; } return null; }
function fmt(n){ return (n==null)?"0":Number(n).toLocaleString("en-US"); }
function inOrder(b){ return BRANCH_ORDER.indexOf(b); }
function renderSingle(snap, prev, isRangeMain){
  if(!snap) return '<div class="note" style="padding:18px 24px">无可用快照数据。</div>';
  var branches=snap.branches||{};
  var distinct=snap.distinct||{};
  var store_cnt=snap.store_cnt||{};
  var total=0, totalDist=snap.total_distinct||0, nonconsume=branches["未消费会员"]||0, nb=0;
  Object.keys(branches).forEach(function(b){ total+=branches[b]; if(b!=="未消费会员"&&b!=="（未匹配门店）") nb++; });
  // 排序：branch_order 优先，其余按记录数
  var known = BRANCH_ORDER.filter(function(b){return b in branches;});
  var others = Object.keys(branches).filter(function(b){return BRANCH_ORDER.indexOf(b)<0;}).sort(function(a,b){return branches[b]-branches[a];});
  var order = known.concat(others);
  var rows="";
  order.forEach(function(b){
    var cnt=branches[b]; var nd=distinct[b];
    var d=null;
    if(prev && prev.branches && (b in prev.branches)){ d=cnt-(prev.branches[b]||0); }
    var dTxt = (d===null)? '<span class="delta flat">—</span>'
      : (d>0? '<span class="delta up">+'+fmt(d)+'</span>' : (d<0? '<span class="delta down">'+fmt(d)+'</span>' : '<span class="delta flat">0</span>'));
    var base = (prev&&prev.branches&&(b in prev.branches))? fmt(prev.branches[b]) : "—";
    var ndTxt = (nd!=null)? fmt(nd) : "—";
    rows+='<tr><td class="bname">'+b+'</td><td class="num">'+fmt(cnt)+'</td><td class="num">'+ndTxt+'</td><td class="num">'+dTxt+'</td><td class="num">'+base+'</td></tr>';
  });
  // 未匹配/剔除说明
  var notes="";
  if(snap.unmatched && Object.keys(snap.unmatched).length){
    var us=Object.keys(snap.unmatched).slice(0,8).map(function(s){return s+"("+snap.unmatched[s]+")";}).join("、");
    notes+='<div class="warn">⚠️ 有 '+Object.keys(snap.unmatched).length+' 个门店名未匹配到分公司（样例：'+us+'），已计入「未匹配门店」。</div>';
  }
  if(snap.excluded_asp){ notes+='<div class="note">🗑️ 已剔除 ASP/AS 及指定门店（'+(EXCLUDED_KW.join("、"))+'）记录 '+fmt(snap.excluded_asp)+' 条。</div>'; }
  if(snap.excluded_branch){ notes+='<div class="note">🗑️ 已剔除门店所属分公司标记为「剔除」的记录 '+fmt(snap.excluded_branch)+' 条。</div>'; }
  // 末位5店
  var bottom="";
  BRANCH_ORDER.forEach(function(b){
    if(!(b in store_cnt)) return;
    var items=Object.keys(store_cnt[b]).map(function(s){return [s,store_cnt[b][s]];}).sort(function(a,b){return a[1]-b[1];}).slice(0,5);
    if(!items.length) return;
    var sub=items.map(function(it){return '<tr><td>'+it[0]+'</td><td class="num">'+it[1]+'</td></tr>';}).join("");
    bottom+='<div class="branch-block"><div class="branch-name">'+b+'</div><table><thead><tr><th>门店</th><th class="num">会员数</th></tr></thead><tbody>'+sub+'</tbody></table></div>';
  });
  var prevLbl = prev? ("对比 "+keyToYmd(prev.date)) : "对比上一可用快照";
  var html='<div class="kpis">'
    +'<div class="kpi"><div class="v">'+fmt(total)+'</div><div class="l">会员沉淀总数（记录）</div></div>'
    +'<div class="kpi"><div class="v">'+fmt(totalDist)+'</div><div class="l">去重会员数</div></div>'
    +'<div class="kpi warn-k"><div class="v">'+fmt(nonconsume)+'</div><div class="l">未消费会员（无首购门店）</div></div>'
    +'<div class="kpi"><div class="v">'+nb+'</div><div class="l">分公司数量</div></div></div>'
    +'<div class="sec"><div class="section-title"><span class="branddot"></span>各分公司会员沉淀（'+keyToYmd(snap.date)+'）</div>'
    +'<table><thead><tr><th>分公司</th><th class="num">会员沉淀（记录）</th><th class="num">去重会员</th><th class="num">'+prevLbl+'</th><th class="num">上一快照</th></tr></thead><tbody>'+rows+'</tbody></table>'+notes+'</div>';
  if(bottom) html+='<div class="sec"><div class="section-title"><span class="branddot" style="background:#F6AA00"></span>各分公司会员数量最少的 5 个门店</div>'+bottom+'</div>';
  return html;
}
function renderRange(snaps){
  // snaps: 按日期升序的快照数组；主看板=最新，附区间走势
  var main=snaps[snaps.length-1];
  var prevOfMain=null;
  if(snaps.length>=2) prevOfMain=snaps[snaps.length-2];
  var html=renderSingle(main, prevOfMain, true);
  var tr="";
  snaps.forEach(function(s){
    tr+='<tr><td>'+keyToYmd(s.date)+'</td><td class="num">'+fmt(s.total_records||0)+'</td><td class="num">'+fmt(s.total_distinct||0)+'</td></tr>';
  });
  html+='<div class="sec"><div class="section-title"><span class="branddot" style="background:#F6AA00"></span>区间每日快照走势</div>'
    +'<table><thead><tr><th>快照日期</th><th class="num">会员沉淀总数</th><th class="num">去重会员</th></tr></thead><tbody>'+tr+'</tbody></table></div>';
  return html;
}
async function render(){
  document.getElementById('content').innerHTML='<div class="note" style="padding:18px 24px">加载中…</div>';
  var dates=selectedDates();
  if(dates.length===0){ document.getElementById('content').innerHTML='<div class="note" style="padding:18px 24px">暂无可用快照（当日快照尚未生成）</div>'; document.getElementById('period').textContent=selectedLabel([]); return; }
  try{
    var snaps=[];
    for(var i=0;i<dates.length;i++){ var s=await loadSnap(dates[i]); if(s) snaps.push(s); }
    if(snaps.length===0){ document.getElementById('content').innerHTML='<div class="note" style="padding:18px 24px">所选日期暂无快照数据。</div>'; document.getElementById('period').textContent=selectedLabel(dates); return; }
    var html;
    if(snaps.length===1){ html=renderSingle(snaps[0], loadSnapSync(prevInIndex(dates[0]))); }
    else { html=renderRange(snaps); }
    document.getElementById('content').innerHTML=html;
    document.getElementById('period').textContent=selectedLabel(dates);
    document.getElementById('noteUpd').textContent=(GENERATED?("数据更新于 "+GENERATED):"")+(NOTE?(" ｜ "+NOTE):"");
  }catch(e){ document.getElementById('content').innerHTML='<div class="note" style="padding:18px 24px">数据加载失败：'+e+'</div>'; }
}
function loadSnapSync(k){ return k? SNAPS[k]||null : null; }
function setMode(m){
  MODE=m;
  document.querySelectorAll('.bar button').forEach(function(b){ b.classList.toggle('on', b.dataset.m===m); });
  document.getElementById('cust').style.display=(m==="自定义")?"inline-flex":"none";
  if(m==="自定义"){ var t=todayKey(); document.getElementById('cstart').value=keyToYmd(firstOfMonthKey(t)); document.getElementById('cend').value=keyToYmd(prevKey(t)); }
  render();
}
function applyCustom(){ CUSTOM.start=ymdToKey(document.getElementById('cstart').value); CUSTOM.end=ymdToKey(document.getElementById('cend').value); render(); }
(async function(){
  await loadIndex();
  var t=todayKey();
  document.getElementById('cstart').value=keyToYmd(firstOfMonthKey(t));
  document.getElementById('cend').value=keyToYmd(prevKey(t));
  setMode("当日");
})();
</script>

</body></html>
